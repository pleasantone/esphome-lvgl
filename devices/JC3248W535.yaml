substitutions:
  # the idle ladder; overridable from a top-level config to test it in seconds
  idle_dim_timeout: 5min
  idle_sleep_timeout: 30min

esphome:
  platformio_options:
    upload_speed: 921600

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      COMPILER_OPTIMIZATION_SIZE: y
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

psram:
  mode: octal
  speed: 80MHz # 120MHz is not supported and falls back to 40MHz

spi:
  - type: quad
    clk_pin: 47
    data_pins: [21, 48, 40, 39]

i2c:
  - sda: 4
    scl: 8

output:
  - id: gpio_backlight_pwm
    platform: ledc
    pin: 1

light:
  - id: backlight
    name: Backlight
    platform: monochromatic
    output: gpio_backlight_pwm
    restore_mode: ALWAYS_ON

display:
  - id: main_display
    platform: mipi_spi
    model: JC3248W535
    data_rate: 40MHz
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - id: main_touchscreen
    platform: axs15231
    on_touch:
      # wakes the panel; lvgl.pause with resume_on_input swallows this touch, so
      # the tap that wakes a dark screen never actuates whatever it landed on
      - light.turn_on:
          id: backlight
          brightness: !lambda return id(active_brightness);
    # on_touch:
    #   - lambda: |-
    #         ESP_LOGI("cal", "x=%d, y=%d, x_raw=%d, y_raw=%0d",
    #           touch.x,
    #           touch.y,
    #           touch.x_raw,
    #           touch.y_raw
    #         );

# The panel has no ambient light sensor, so it borrows Home Assistant's view of
# the sun. Everything else here is already useless without HA, and a stale
# elevation only matters if HA stays down across a sunset -- a restart moves the
# sun by nothing. Defaults to full brightness, so a cold boot with no HA is
# bright rather than dark.
globals:
  - id: active_brightness # the ceiling; idle dims relative to it
    type: float
    restore_value: false
    initial_value: '1.0'
  - id: idle_sleep_dark # cleared by a layout that keeps something on screen at the sleep timeout
    type: bool
    restore_value: false
    initial_value: 'true'
  - id: sun_band # 2 day, 1 dusk, 0 night -- only a change re-applies brightness
    type: int
    restore_value: false
    initial_value: '2'

sensor:
  - id: sun_elevation
    platform: homeassistant
    entity_id: sun.sun
    attribute: elevation
    on_value:
      - lambda: |-
          if (std::isnan(x)) {
            return;
          }
          int band = x > 6.0f ? 2 : (x > -6.0f ? 1 : 0);
          if (band == id(sun_band)) {
            return;
          }
          id(sun_band) = band;
          id(active_brightness) = band == 2 ? 1.0f : (band == 1 ? 0.6f : 0.35f);
          // only follow the change if the panel is awake; if it is idling or
          // dark, the next touch picks the new ceiling up
          if (id(backlight).current_values.is_on() &&
              id(backlight).current_values.get_brightness() > id(active_brightness) * 0.5f) {
            auto call = id(backlight).turn_on();
            call.set_brightness(id(active_brightness));
            call.perform();
          }

# Going dark, as a script so a layout can also call it on demand. It waits
# for the finger to lift before pausing: resume_on_input wakes on a release,
# so a pause under a held finger would undo itself, and the next tap would
# land on a live screen instead of being swallowed.
script:
  - id: display_sleep
    then:
      - light.turn_off: backlight
      - wait_until:
          condition:
            - lambda: return id(main_touchscreen)->get_touches().empty();
      - lvgl.pause:
          show_snow: false

lvgl:
  on_idle:
    - timeout: ${idle_dim_timeout}
      then:
        # dimming never raises the backlight, so a sleep clock already up at a
        # lower level -- put there by hand before this fired -- stays put
        - if:
            condition:
              - lambda: |-
                  return id(backlight).current_values.is_on() &&
                         id(backlight).current_values.get_brightness() > id(active_brightness) * 0.25f;
            then:
              - light.turn_on:
                  id: backlight
                  brightness: !lambda return id(active_brightness) * 0.25f;
    - timeout: ${idle_sleep_timeout}
      then:
        - if:
            condition:
              - lambda: return id(idle_sleep_dark);
            then:
              - script.execute: display_sleep
