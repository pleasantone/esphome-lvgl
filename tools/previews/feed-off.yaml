# Fork-only preview scenario "off" for the HA-fed parts (chip strip, printer
# cards, alert takeover): publishes sample feed values at boot, through the
# real parsing in feed.h. Used by sdl-feed-off.yaml; never on a panel.
esphome:
  on_boot:
    - priority: -150
      then:
        - lambda: |-
            feed::frozen() = true;
            feed::now_ref() = 1791960000;
            auto J = [](std::vector<std::string> v) {
              std::string s = "v";
              for (auto &x : v) { s += '\x1f'; s += x; }
              return s;
            };
            id(chips_feed).publish_state(J({"night|info|56° Clear", "shield|info|Alarm off"}));
            id(p_x1c_feed).publish_state(J({"off|Off|Last: Bag Pack Clip rounded · §a1791180000§ ago", "-1|||", "—|—|—", "Auto-off when on: after 4 h idle", "", "AMS 1|14% · 24°|;#000000|PLA||;#BCBCBC|PLA||;#FFFFFF|PLA Basic|530 g|;#000000|Empty||e", "", ""}));
            id(p_h2c_feed).publish_state(J({"off|Off|Last: Guition Esp32 P4 JC1060P470 Desk Stand · §a1791532000§ ago", "-1|||", "—|—|—", "Auto-off when on: after 4 h idle", "", "AMS 1|16% · 23°|;#C12E1F|PLA Basic|579 g|;#000000|PLA Matte|524 g|;#006AB8|PLA+ 2.0|886 g|;#000000|PETG-HS Matte|820 g|", "AMS 2|19% · 24°|;#808080|PETG Marble|329 g|;#4EE349|PLA+ 2.0|823 g|;#FFFFFF|PLA Meta|853 g|;#000000|PETG-CF Basic|721 g|", "HT|21% · 20°|;#000000|Empty||e"}));
