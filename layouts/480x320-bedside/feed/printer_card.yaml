# Fork-only: one printer as a half-width card for the landscape Printers page.
# Same parts and ids as 480x320-home/feed/printer_card.yaml, drawn by the same
# feed::set_card / set_row; the time line wraps instead of truncating.
# required vars: uid, name

# obj:
  id: ${uid}_card
  width: 49%
  height: 100%
  bg_color: 0x5A6173
  border_width: 0
  radius: 16
  pad_all: 8
  scrollable: false
  clickable: false
  layout: { type: FLEX, flex_flow: COLUMN, pad_row: 4 }
  widgets:
    - obj:
        clickable: false
        scrollable: false
        width: 100%
        height: 26
        bg_opa: TRANSP
        border_width: 0
        pad_all: 0
        widgets:
          - label: { align: LEFT_MID, text: "${name}", text_font: roboto_md }
          - obj:
              id: ${uid}_pill
              clickable: false
              scrollable: false
              align: RIGHT_MID
              width: SIZE_CONTENT
              height: 24
              radius: 12
              border_width: 0
              bg_color: 0x4A5060
              pad_top: 0
              pad_bottom: 0
              pad_left: 10
              pad_right: 10
              widgets:
                - label: { id: "${uid}_pill_lbl", align: CENTER, text: "--", text_font: roboto_sm }
    - label: { id: "${uid}_task", width: 100%, height: 20, long_mode: DOT, text: "", text_font: roboto_sm, text_color: 0xC9CED8 }
    - bar:
        id: ${uid}_bar
        hidden: true
        clickable: false
        width: 100%
        height: 6
        min_value: 0
        max_value: 100
        bg_color: 0x3A4050
        indicator:
          bg_color: 0xFFAF00
    - label: { id: "${uid}_time", hidden: true, width: 100%, long_mode: WRAP, text: "", text_font: roboto_sm }
    - label: { id: "${uid}_alert", hidden: true, width: 100%, long_mode: WRAP, text: "", text_font: roboto_sm, text_color: 0xFF8A80 }
    - obj: { <<: !include { file: ams_row.yaml, vars: { row: 1 } } }
    - obj: { <<: !include { file: ams_row.yaml, vars: { row: 2 } } }
    - obj: { <<: !include { file: ams_row.yaml, vars: { row: 3 } } }
