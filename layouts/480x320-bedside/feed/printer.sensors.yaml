# Fork-only: one subscription per printer for the landscape cards -- the same
# feed and drawing as 480x320-home/feed/printer.sensors.yaml, plus the unit
# label taking the hidden humidity's colour (amber = drying or damp), and time
# left / finish on two lines rather than one wrapped mid-time.
# required vars: uid, printer (x1c / h2c)

text_sensor:
  - id: ${uid}_feed
    platform: homeassistant
    internal: true
    entity_id: sensor.office_panel_printers
    attribute: ${printer}_page_all
    on_value:
      - lambda: |-
          auto f = feed::fields(x);
          feed::set_card({id(${uid}_pill), id(${uid}_pill_lbl), id(${uid}_task), id(${uid}_bar), id(${uid}_time), id(${uid}_alert)}, f);
          auto job = feed::split(feed::part(f, 1), '|');
          if (!feed::part(job, 1).empty() && !feed::part(job, 2).empty())
            feed::text(id(${uid}_time), feed::part(job, 1) + "\n" + feed::part(job, 2));
          feed::set_row({id(${uid}_r1), id(${uid}_r1_lbl), id(${uid}_r1_meta), {id(${uid}_r1_s1), id(${uid}_r1_s2), id(${uid}_r1_s3), id(${uid}_r1_s4)}, {id(${uid}_r1_a1), id(${uid}_r1_a2), id(${uid}_r1_a3), id(${uid}_r1_a4)}}, feed::part(f, 5));
          feed::fg(id(${uid}_r1_lbl), lv_color_to_u32(lv_obj_get_style_text_color(id(${uid}_r1_meta), LV_PART_MAIN)) & 0xFFFFFF);
          feed::set_row({id(${uid}_r2), id(${uid}_r2_lbl), id(${uid}_r2_meta), {id(${uid}_r2_s1), id(${uid}_r2_s2), id(${uid}_r2_s3), id(${uid}_r2_s4)}, {id(${uid}_r2_a1), id(${uid}_r2_a2), id(${uid}_r2_a3), id(${uid}_r2_a4)}}, feed::part(f, 6));
          feed::fg(id(${uid}_r2_lbl), lv_color_to_u32(lv_obj_get_style_text_color(id(${uid}_r2_meta), LV_PART_MAIN)) & 0xFFFFFF);
          feed::set_row({id(${uid}_r3), id(${uid}_r3_lbl), id(${uid}_r3_meta), {id(${uid}_r3_s1), id(${uid}_r3_s2), id(${uid}_r3_s3), id(${uid}_r3_s4)}, {id(${uid}_r3_a1), id(${uid}_r3_a2), id(${uid}_r3_a3), id(${uid}_r3_a4)}}, feed::part(f, 7));
          feed::fg(id(${uid}_r3_lbl), lv_color_to_u32(lv_obj_get_style_text_color(id(${uid}_r3_meta), LV_PART_MAIN)) & 0xFFFFFF);
