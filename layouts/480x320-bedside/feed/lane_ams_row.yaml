# Fork-only: one AMS unit on a printer lane (square Printers page, 4848S040
# mockup) -- the unit, four 60x32 swatches in the filament's colour with the
# grams, then the unit's humidity and temperature, or its drying time left
# (printer_lane.h). Fixed swatch widths, so a one-slot HT row sits under slot 1.
# Hidden until feed::set_row gets a value.
# required vars: uid, row

# obj:
  id: ${uid}_r${row}
  hidden: true
  clickable: false
  scrollable: false
  width: 100%
  height: 32
  bg_opa: TRANSP
  border_width: 0
  pad_all: 0
  layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 6 }
  widgets:
    - label: { id: "${uid}_r${row}_lbl", width: 26, text: "", text_font: roboto_md, text_color: 0xC9CED8 }
    - obj:
        id: ${uid}_r${row}_s1
        clickable: false
        scrollable: false
        width: 60
        height: 32
        radius: 10
        border_width: 1
        border_color: 0x2A2F3A
        bg_color: 0x000000
        pad_all: 0
        widgets:
          - label: { id: "${uid}_r${row}_a1", align: CENTER, text: "", text_font: roboto_md }
    - obj:
        id: ${uid}_r${row}_s2
        clickable: false
        scrollable: false
        width: 60
        height: 32
        radius: 10
        border_width: 1
        border_color: 0x2A2F3A
        bg_color: 0x000000
        pad_all: 0
        widgets:
          - label: { id: "${uid}_r${row}_a2", align: CENTER, text: "", text_font: roboto_md }
    - obj:
        id: ${uid}_r${row}_s3
        clickable: false
        scrollable: false
        width: 60
        height: 32
        radius: 10
        border_width: 1
        border_color: 0x2A2F3A
        bg_color: 0x000000
        pad_all: 0
        widgets:
          - label: { id: "${uid}_r${row}_a3", align: CENTER, text: "", text_font: roboto_md }
    - obj:
        id: ${uid}_r${row}_s4
        clickable: false
        scrollable: false
        width: 60
        height: 32
        radius: 10
        border_width: 1
        border_color: 0x2A2F3A
        bg_color: 0x000000
        pad_all: 0
        widgets:
          - label: { id: "${uid}_r${row}_a4", align: CENTER, text: "", text_font: roboto_md }
    - obj: # right-justified by its container: text_align does not take here
        clickable: false
        scrollable: false
        flex_grow: 1
        height: 32
        bg_opa: TRANSP
        border_width: 0
        pad_all: 0
        layout: { type: FLEX, flex_flow: ROW, flex_align_main: END, flex_align_cross: CENTER }
        widgets:
          - label: { id: "${uid}_r${row}_meta", text: "", text_font: roboto_sm, text_color: 0xC9CED8 }
