# Chip list, landscape (fork-only exercise, from 480x320-home/pages/chips.yaml):
# every chip in full words, two columns. Opened by the rail's status button or a
# tap on the bedside grid. The strip itself stays one line: compact routine chips plus a "+N"
# chip (feed.h fit_chips). Not in the page switcher. Needs the chip strip package
# (open_chip_list, chips_changed, feed::chips). Include it from the top-level config.

lvgl:
  pages:
    - id: chip_list
      skip: true
      <<: !include ../vars/page.yaml
      bg_color: 0x42495A # a page keeps LVGL's near-white otherwise
      on_load:
        - lvgl.label.update:
            id: page_title
            text: Alerts & status
        - lambda: |-
            feed::list_showing() = true;
            lv_obj_t *b[] = {id(cl_1), id(cl_2), id(cl_3), id(cl_4), id(cl_5), id(cl_6), id(cl_7), id(cl_8)};
            lv_obj_t *ic[] = {id(cl_1_ic), id(cl_2_ic), id(cl_3_ic), id(cl_4_ic), id(cl_5_ic), id(cl_6_ic), id(cl_7_ic), id(cl_8_ic)};
            lv_obj_t *tx[] = {id(cl_1_tx), id(cl_2_tx), id(cl_3_tx), id(cl_4_tx), id(cl_5_tx), id(cl_6_tx), id(cl_7_tx), id(cl_8_tx)};
            feed::set_list(feed::chips(), b, ic, tx, 8);
      on_unload:
        - lambda: feed::list_showing() = false;
      widgets:
        - obj:
            <<: !include ../vars/container.yaml
            layout:
              type: FLEX
              flex_flow: ROW_WRAP
              flex_align_main: SPACE_BETWEEN
              pad_row: 6
              pad_column: 6
            widgets:
              - obj:
                  id: cl_1
                  hidden: true
                  clickable: false
                  scrollable: false
                  width: 49%
                  height: ${bedside_chip_height}
                  radius: 12
                  border_width: 0
                  bg_color: 0x5A6173
                  pad_top: 4
                  pad_bottom: 4
                  pad_left: 10
                  pad_right: 10
                  layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, flex_align_track: CENTER, pad_column: 8 }
                  widgets:
                    - label: { id: cl_1_ic, text: "", text_font: mdi_sm }
                    - label: { id: cl_1_tx, flex_grow: 1, height: 20, long_mode: DOT, text: "", text_font: roboto_sm }
              - obj:
                  id: cl_2
                  hidden: true
                  clickable: false
                  scrollable: false
                  width: 49%
                  height: ${bedside_chip_height}
                  radius: 12
                  border_width: 0
                  bg_color: 0x5A6173
                  pad_top: 4
                  pad_bottom: 4
                  pad_left: 10
                  pad_right: 10
                  layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, flex_align_track: CENTER, pad_column: 8 }
                  widgets:
                    - label: { id: cl_2_ic, text: "", text_font: mdi_sm }
                    - label: { id: cl_2_tx, flex_grow: 1, height: 20, long_mode: DOT, text: "", text_font: roboto_sm }
