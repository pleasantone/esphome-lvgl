                  pad_top: 4
                  pad_bottom: 4
                  pad_left: 10
                  pad_right: 10
                  layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, flex_align_track: CENTER, pad_column: 8 }
                  widgets:
                    - label: { id: cl_3_ic, text: "", text_font: mdi_sm }
                    - label: { id: cl_3_tx, flex_grow: 1, height: 20, long_mode: DOT, text: "", text_font: roboto_sm }
              - obj:
