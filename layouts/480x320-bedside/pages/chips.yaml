                    - label: { id: cl_8_tx, flex_grow: 1, height: 20, long_mode: DOT, text: "", text_font: roboto_sm }
              - button:
                  width: 100%
                  height: ${bedside_chip_height}
                  radius: 44
                  bg_color: 0x5A6173
                  widgets:
                    - label: { align: CENTER, text: Done, text_font: roboto_lg }
                  on_click:
                    - lambda: id(main_lvgl)->show_page(id(chip_list_origin), LV_SCREEN_LOAD_ANIM_NONE, 0);

globals:
  - id: chip_list_origin # page index to go back to on Done
    type: int
    restore_value: false
    initial_value: '0'

script:
  - id: !extend open_chip_list
    then:
      - lambda: id(chip_list_origin) = id(main_lvgl)->get_current_page();
      - lvgl.page.show: chip_list
  - id: !extend chips_changed
    then:
      - lambda: |-
          if (!feed::list_showing()) return;
          lv_obj_t *b[] = {id(cl_1), id(cl_2), id(cl_3), id(cl_4), id(cl_5), id(cl_6), id(cl_7), id(cl_8)};
          lv_obj_t *ic[] = {id(cl_1_ic), id(cl_2_ic), id(cl_3_ic), id(cl_4_ic), id(cl_5_ic), id(cl_6_ic), id(cl_7_ic), id(cl_8_ic)};
          lv_obj_t *tx[] = {id(cl_1_tx), id(cl_2_tx), id(cl_3_tx), id(cl_4_tx), id(cl_5_tx), id(cl_6_tx), id(cl_7_tx), id(cl_8_tx)};
          feed::set_list(feed::chips(), b, ic, tx, 8);
