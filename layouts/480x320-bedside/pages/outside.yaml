# Fork-only: 480x320-home/pages/outside.yaml re-laid for the landscape bedside
# layout. Same ids and the same Home Assistant wiring (everything below "Home
# Assistant wiring" is copied verbatim -- keep the two in step), but the blocks
# sit in four rows across the 404px beside the rail instead of one tall stack:
#
#   clock | verdict                  56
#   temperature                      94
#   sunrise .. now .. sunset         44
#   air / pollen / dust | rain       90   (+ 3 x 4 gap = 296 of 308)
#
# Like the portrait page it hides the titlebar -- this page is already a clock.

lvgl:
  pages:
    - id: outside
      <<: !include ../vars/page.yaml
      pad_top: 6 # no titlebar here
      on_load:
        - lvgl.label.update:
            id: page_title
            text: Outside
        - script.execute: refresh_outside_clock
        - script.execute: refresh_outside_link
        # after the page this one replaced has had its unload: the bedside
        # page and the sleep clock show the titlebar again in theirs
        - delay: 20ms
        - lvgl.widget.hide: titlebar
      on_unload:
        - lvgl.widget.show: titlebar
      widgets:
        - obj:
            <<: !include ../vars/container.yaml
            layout:
              type: FLEX
              flex_flow: ROW_WRAP
              flex_align_main: SPACE_BETWEEN
              pad_row: 4
              pad_column: 4

            widgets:
              # ---- time ----------------------------------------------------
              - obj:
                  width: 120
                  height: 56
                  border_width: 0
                  radius: 20
                  pad_all: 2
                  scrollable: false
                  widgets:
                    - label:
                        id: out_clock
                        text: "--:--"
                        text_font: roboto_clock
                        align: CENTER
                    - label: # the titlebar carried this; without it the page
                             # has to say when it has stopped being true
                        id: out_link_lost
                        text: "\U000F0319"
                        text_font: mdi_sm
                        text_color: 0xFF6B60
                        align: TOP_RIGHT
                        hidden: true

              # ---- the answer ----------------------------------------------
              - obj:
                  flex_grow: 1
                  height: 56
                  border_width: 0
                  radius: 20
                  pad_all: 4
                  pad_left: 10
                  scrollable: false
                  widgets:
                    # explicit heights: LV_LABEL_LONG_DOT only truncates when
                    # the height is bounded
                    - label:
                        id: out_verdict
                        text: " "
                        text_font: roboto_lg
                        width: 100%
                        height: 30
                        long_mode: DOT
                        align: TOP_LEFT
                    - label:
                        id: out_narrative
                        text: " "
                        text_font: roboto_sm
                        text_color: 0x9AA0AE
                        width: 100%
                        height: 18
                        long_mode: DOT
                        align: BOTTOM_LEFT

              # ---- temperature ---------------------------------------------
              - obj:
                  width: 100%
                  height: 94
                  border_width: 0
                  radius: 20
                  pad_all: 8
                  pad_left: 14
                  pad_right: 14
                  scrollable: false
                  widgets:
                    - label:
                        id: out_temp
                        text: "--°"
                        text_font: roboto_temp
                        align: LEFT_MID
                    - obj:
                        width: 240
                        height: 100%
                        align: RIGHT_MID
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        scrollable: false
                        layout:
                          type: FLEX
                          flex_flow: COLUMN
                          flex_align_main: SPACE_EVENLY
                          flex_align_cross: END
                        widgets:
                          - label:
                              id: out_cond
                              text: " "
                              text_font: roboto_md
                          - label:
                              id: out_highlow
                              text: " "
                              text_font: roboto_sm
                              text_color: 0x9AA0AE
                          - label:
                              id: out_feels
                              text: " "
                              text_font: roboto_sm
                              text_color: 0x9AA0AE

              # ---- sunrise .. now .. sunset ---------------------------------
              - obj:
                  width: 100%
                  height: 44
                  border_width: 0
                  radius: 20
                  pad_all: 6
                  pad_left: 12
                  pad_right: 12
                  scrollable: false
                  widgets:
                    - label: # weather-sunset-up
                        text: "\U000F059C"
                        text_font: mdi_sm
                        text_color: 0xFFAF00
                        align: TOP_LEFT
                    - label:
                        id: out_sunrise
                        text: "--:--"
                        text_font: roboto_sm
                        align: TOP_LEFT
                        x: 26
                        y: 2
                    - label: # weather-sunset-down
                        text: "\U000F059B"
                        text_font: mdi_sm
                        text_color: 0xFFAF00
                        align: TOP_RIGHT
                    - label:
                        id: out_sunset
                        text: "--:--"
                        text_font: roboto_sm
                        align: TOP_RIGHT
                        x: -26
                        y: 2
                    - label:
                        id: out_light_left
                        text: " "
                        text_font: roboto_sm
                        text_color: 0x9AA0AE
                        align: TOP_MID
                        y: 2
                    - bar:
                        id: out_sun_bar
                        width: 100%
                        height: 6
                        align: BOTTOM_MID
                        value: 0
                        indicator:
                          bg_color: 0xFFAF00
                    - obj: # now
                        id: out_sun_dot
                        width: 12
                        height: 12
                        radius: 6
                        border_width: 0
                        bg_color: 0xFFFFFF
                        align: BOTTOM_LEFT
                        x: 0
                        y: 0 # not past the bottom edge, or the block scrolls

              # ---- the three indexes ---------------------------------------
              - obj:
                  width: 60%
                  height: 90
                  border_width: 0
                  radius: 20
                  pad_all: 6
                  pad_left: 12
                  pad_right: 12
                  scrollable: false
                  layout:
                    type: FLEX
                    flex_flow: COLUMN
                    flex_align_main: SPACE_EVENLY
                  widgets:
                    - obj: # air
                        <<: &index_row
                          width: 100%
                          height: 26
                          border_width: 0
                          bg_opa: TRANSP
                          pad_all: 0
                          scrollable: false
                        widgets:
                          - label: { text: "Air", text_font: roboto_md, align: LEFT_MID }
                          - bar:
                              id: out_air_bar
                              <<: &index_bar
                                width: 64
                                height: 10
                                align: LEFT_MID
                                x: 64
                                value: 0
                                indicator:
                                  bg_color: 0x34C759
                          - label:
                              id: out_air_val
                              text: "--"
                              text_font: roboto_md
                              align: RIGHT_MID
                    - obj: # pollen
                        <<: *index_row
                        widgets:
                          - label: { text: "Pollen", text_font: roboto_md, align: LEFT_MID }
                          - bar:
                              id: out_pollen_bar
                              <<: *index_bar
                          - label:
                              id: out_pollen_val
                              text: "--"
                              text_font: roboto_md
                              align: RIGHT_MID
                    - obj: # dust and dander
                        <<: *index_row
                        widgets:
                          - label: { text: "Dust", text_font: roboto_md, align: LEFT_MID }
                          - bar:
                              id: out_dust_bar
                              <<: *index_bar
                          - label:
                              id: out_dust_val
                              text: "--"
                              text_font: roboto_md
                              align: RIGHT_MID

              # ---- rain, next 12 hours, or why it isn't here ----------------
              # Exactly one of the two fills this corner (the rain script
              # swaps them), so a missing strip can't pass for a dry one.
              - obj:
                  flex_grow: 1
                  height: 90
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  widgets:
                    - obj:
                        id: out_rain_block
                        width: 100%
                        height: 100%
                        hidden: true
                        border_width: 0
                        radius: 20
                        pad_all: 6
                        pad_left: 10
                        pad_right: 10
                        scrollable: false
                        widgets:
                          - label:
                              text: "Rain"
                              text_font: roboto_sm
                              align: TOP_LEFT
                          - label:
                              id: out_rain_summary
                              text: " "
                              text_font: roboto_sm
                              align: TOP_RIGHT
                          - obj: # the columns
                              width: 100%
                              height: 36
                              align: BOTTOM_MID
                              border_width: 0
                              bg_opa: TRANSP
                              pad_all: 0
                              scrollable: false
                              layout:
                                type: FLEX
                                flex_flow: ROW
                                flex_align_main: SPACE_BETWEEN
                                flex_align_cross: END
                              widgets:
                                - obj:
                                    <<: &rain_slot
                                      width: 18
                                      height: 34
                                      radius: 4
                                      border_width: 0
                                      bg_color: 0x353B4A
                                      pad_all: 0
                                    widgets:
                                      - obj:
                                          id: out_rain_1
                                          <<: &rain_fill
                                            width: 100%
                                            height: 3
                                            radius: 4
                                            border_width: 0
                                            bg_color: 0x00B6FF
                                            align: BOTTOM_MID
                                - obj:
                                    <<: *rain_slot
                                    widgets:
                                      - obj:
                                          id: out_rain_2
                                          <<: *rain_fill
                                - obj:
                                    <<: *rain_slot
                                    widgets:
                                      - obj:
                                          id: out_rain_3
                                          <<: *rain_fill
                                - obj:
                                    <<: *rain_slot
                                    widgets:
                                      - obj:
                                          id: out_rain_4
                                          <<: *rain_fill
                                - obj:
                                    <<: *rain_slot
                                    widgets:
                                      - obj:
                                          id: out_rain_5
                                          <<: *rain_fill
                                - obj:
                                    <<: *rain_slot
                                    widgets:
                                      - obj:
                                          id: out_rain_6
                                          <<: *rain_fill
                    - obj:
                        id: out_dry_block
                        width: 100%
                        height: 100%
                        border_width: 0
                        radius: 20
                        pad_all: 8
                        scrollable: false
                        widgets:
                          - label:
                              id: out_dry_text
                              width: 100%
                              long_mode: WRAP
                              text: "Waiting for the rain forecast"
                              text_font: roboto_sm
                              text_color: 0x9AA0AE
                              text_align: CENTER
                              align: CENTER

# ---------------------------------------------------------------------------
# Home Assistant wiring
# ---------------------------------------------------------------------------

font:
  # 56px sits between the layout's xl (32) and xxl (48) ladder rungs. Defined
  # here rather than moving text_xxl, because widgets/detail/light_page.yaml
  # also draws at roboto_xxl and has no reason to grow.
  - id: roboto_temp
    file:
      type: gfonts
      family: Roboto
    size: 56
    bpp: 4

  - id: roboto_clock
    file:
      type: gfonts
      family: Roboto
    size: 40
    bpp: 4

script:
  # The header owns ha_time and its own clock; this page keeps a second, bigger
  # one. Both honour the 24-hour switch in widgets/header/sensors.yaml.
  - id: refresh_outside_clock
    then:
      - lvgl.label.update:
          id: out_clock
          text: !lambda |-
            auto now = id(ha_time).now();
            if (!now.is_valid()) {
              return std::string("--:--");
            }
            if (id(clock_24h).state) {
              return now.strftime("%H:%M");
            }
            // %I pads the hour with a zero; a wall clock does not
            auto s = now.strftime("%I:%M");
            if (s[0] == '0') s.erase(0, 1);
            return s;

  - id: refresh_outside_cond
    then:
      - lvgl.label.update:
          id: out_cond
          text: !lambda |-
            std::string s = id(out_cond_text);
            // UV is 0 after dark, so this also serves as the daylight gate --
            // no extra entity needed to keep it off the page at night
            if (!std::isnan(id(out_uv_val)) && id(out_uv_val) >= 1.0f) {
              if (!s.empty()) s += " \xc2\xb7 ";
              s += "UV " + std::to_string((int) lroundf(id(out_uv_val)));
            }
            return s.empty() ? std::string(" ") : s;

  - id: refresh_outside_link
    then:
      - if:
          condition:
            - binary_sensor.is_on: api_link
          then:
            - lvgl.widget.hide: out_link_lost
          else:
            - lvgl.widget.show: out_link_lost

  - id: refresh_outside_feels
    then:
      - lvgl.label.update:
          id: out_feels
          text: !lambda |-
            std::string s;
            if (!std::isnan(id(out_feels_val))) {
              s = "Feels " + std::to_string((int) lroundf(id(out_feels_val))) + "°";
            }
            if (!std::isnan(id(out_humidity_val))) {
              if (!s.empty()) s += " \xc2\xb7 ";
              s += std::to_string((int) lroundf(id(out_humidity_val))) + "%";
            }
            if (!std::isnan(id(out_wind_val))) {
              if (!s.empty()) s += " \xc2\xb7 ";
              int w = (int) lroundf(id(out_wind_val));
              int g = std::isnan(id(out_gust_val)) ? w : (int) lroundf(id(out_gust_val));
              // only name the gust when it is actually gusting
              s += std::to_string(w) + (g >= w + 3 ? "-" + std::to_string(g) : "") + " mph";
            }
            return s.empty() ? std::string(" ") : s;

  - id: refresh_outside_air
    then:
      - lambda: |-
          // EPA AQI bands. The bar tops out at 150 rather than 500: above that
          // the number is the story, and a bar pinned at 7% is not.
          float a = id(out_aqi_val);
          if (std::isnan(a)) {
            lv_bar_set_value(id(out_air_bar), 0, LV_ANIM_OFF);
            lv_label_set_text(id(out_air_val), "--");
            return;
          }
          int aqi = (int) lroundf(a);
          uint32_t c = aqi <= 50 ? 0x34C759 : aqi <= 100 ? 0xFFD60A
                     : aqi <= 150 ? 0xFF9F0A : 0xFF3B30;
          int v = aqi > 150 ? 100 : (aqi * 100) / 150;
          lv_bar_set_value(id(out_air_bar), v, LV_ANIM_OFF);
          lv_obj_set_style_bg_color(id(out_air_bar), lv_color_hex(c), LV_PART_INDICATOR);
          // the bar already says how much; the words say whether to care
          lv_label_set_text(id(out_air_val),
                            id(out_air_desc).empty() ? "--" : id(out_air_desc).c_str());

  - id: refresh_outside_dust
    then:
      - lambda: |-
          // The dust score is a local model, 0-100, and in San Francisco it
          // lives in the teens -- so the bar is scaled to 60, not 100.
          float d = id(out_dust_val_num);
          if (std::isnan(d)) {
            lv_bar_set_value(id(out_dust_bar), 0, LV_ANIM_OFF);
            lv_label_set_text(id(out_dust_val), "--");
            return;
          }
          int score = (int) lroundf(d);
          uint32_t c = score < 20 ? 0x34C759 : score < 40 ? 0xFFD60A
                     : score < 60 ? 0xFF9F0A : 0xFF3B30;
          int v = score >= 60 ? 100 : (score * 100) / 60;
          lv_bar_set_value(id(out_dust_bar), v, LV_ANIM_OFF);
          lv_obj_set_style_bg_color(id(out_dust_bar), lv_color_hex(c), LV_PART_INDICATOR);
          // the bar already says how much; the words say whether to care
          lv_label_set_text(id(out_dust_val),
                            id(out_dust_level).empty() ? "--" : id(out_dust_level).c_str());

interval:
  # Cheaper and far less fragile than reaching into the header's ha_time
  # automation with !extend; ten seconds is under half a minute of skew.
  - interval: 10s
    then:
      - script.execute: refresh_outside_clock
      - script.execute: refresh_outside_link

text_sensor:
  - id: out_sunrise_sensor
    platform: homeassistant
    entity_id: sensor.sunrise_time
    on_value:
      - lvgl.label.update:
          id: out_sunrise
          text: !lambda |-
            if (x.empty()) return std::string("--:--");
            return x;

  - id: out_sunset_sensor
    platform: homeassistant
    entity_id: sensor.sunset_time
    on_value:
      - lvgl.label.update:
          id: out_sunset
          text: !lambda |-
            if (x.empty()) return std::string("--:--");
            return x;

  - id: out_light_left_sensor
    platform: homeassistant
    entity_id: sensor.daylight_left
    on_value:
      - lvgl.label.update:
          id: out_light_left
          text: !lambda |-
            if (x == "dark" || x.empty()) return std::string("after dark");
            return x + " of light left";

  - id: out_cond_sensor
    platform: homeassistant
    entity_id: weather.forecast_home
    on_value:
      - lambda: |-
          std::string s;
          // Home Assistant's condition slugs are not for reading aloud
          if (x == "clear-night") s = "Clear";
          else if (x == "partlycloudy") s = "Partly cloudy";
          else if (x == "lightning" || x == "lightning-rainy") s = "Storm";
          else if (x == "snowy-rainy") s = "Sleet";
          else if (x == "windy-variant") s = "Windy";
          else if (x == "pouring") s = "Pouring";
          else if (x == "rainy") s = "Rain";
          else if (x == "exceptional" || x.empty()) s = "";
          else { s = x; s[0] = toupper(s[0]); }
          id(out_cond_text) = s;
      - script.execute: refresh_outside_cond

  - id: out_air_desc_sensor
    platform: homeassistant
    entity_id: sensor.airnow_air_quality_index
    attribute: description
    on_value:
      - lambda: id(out_air_desc) = x;
      - script.execute: refresh_outside_air

  - id: out_pollen_sensor
    platform: homeassistant
    entity_id: sensor.pollen_summary
    on_value:
      - lvgl.label.update:
          id: out_pollen_val
          text: !lambda |-
            if (x.empty()) return std::string("--");
            return x;
      - lambda: |-
          // Google's five categories, spread across the bar
          int v = 0;
          uint32_t c = 0x34C759;
          if (x == "Very Low")       { v = 10; c = 0x34C759; }
          else if (x == "Low")       { v = 30; c = 0x34C759; }
          else if (x == "Moderate")  { v = 55; c = 0xFFD60A; }
          else if (x == "High")      { v = 78; c = 0xFF9F0A; }
          else if (x == "Very High") { v = 95; c = 0xFF3B30; }
          lv_bar_set_value(id(out_pollen_bar), v, LV_ANIM_OFF);
          lv_obj_set_style_bg_color(id(out_pollen_bar), lv_color_hex(c), LV_PART_INDICATOR);

  - id: out_dust_level_sensor
    platform: homeassistant
    entity_id: sensor.dust_conditions
    attribute: level
    on_value:
      - lambda: id(out_dust_level) = x;
      - script.execute: refresh_outside_dust

  - id: out_verdict_sensor
    platform: homeassistant
    entity_id: sensor.walk_verdict
    on_value:
      - lvgl.label.update:
          id: out_verdict
          text: !lambda |-
            if (x.empty()) return std::string(" ");
            return x;

  - id: out_narrative_sensor
    platform: homeassistant
    entity_id: sensor.walk_verdict
    attribute: narrative
    on_value:
      - lvgl.label.update:
          id: out_narrative
          text: !lambda |-
            if (x.empty()) return std::string(" ");
            return x;

  - id: out_highlow_sensor
    platform: homeassistant
    entity_id: sensor.today_high_low
    on_value:
      - lvgl.label.update:
          id: out_highlow
          text: !lambda |-
            if (x.empty()) return std::string(" ");
            return x;

  - id: out_rain_summary_sensor
    platform: homeassistant
    entity_id: sensor.rain_next_12h
    attribute: summary
    on_value:
      - lvgl.label.update:
          id: out_rain_summary
          text: !lambda |-
            if (x.empty()) return std::string(" ");
            return x;


  - id: out_rain_hours_sensor
    platform: homeassistant
    entity_id: sensor.rain_next_12h
    on_value:
      - lambda: |-
          // "0,0,10,20,..." -- twelve hourly probabilities, folded into six
          // two-hour slots by taking the worse hour of each pair.
          int p[12] = {0};
          size_t start = 0;
          for (int i = 0; i < 12 && start <= x.size(); i++) {
            size_t comma = x.find(',', start);
            std::string tok = x.substr(start, comma == std::string::npos
                                              ? std::string::npos : comma - start);
            p[i] = tok.empty() ? 0 : atoi(tok.c_str());
            if (comma == std::string::npos) break;
            start = comma + 1;
          }
          lv_obj_t *slots[6] = {id(out_rain_1), id(out_rain_2), id(out_rain_3),
                                id(out_rain_4), id(out_rain_5), id(out_rain_6)};
          int worst = 0;
          for (int s = 0; s < 6; s++) {
            int v = p[s * 2] > p[s * 2 + 1] ? p[s * 2] : p[s * 2 + 1];
            if (v < 0) v = 0;
            if (v > 100) v = 100;
            if (v > worst) worst = v;
            // 3px even at zero, so a dry slot still reads as a slot
            lv_obj_set_height(slots[s], 3 + (31 * v) / 100);
          }
          // An unavailable entity publishes an empty or placeholder string,
          // which parses to twelve zeroes -- indistinguishable from a genuine
          // dry forecast unless it is caught here, before worst is believed.
          bool known = !(x.empty() || x == "unknown" || x == "unavailable");
          lv_label_set_text(id(out_dry_text),
                            known ? "No rain in the next 12 hours"
                                  : "Rain forecast unavailable");
          // Nothing to forecast is not worth 68px of six flat slots -- but
          // exactly one of the two blocks is always shown, so a missing strip
          // can never be mistaken for a dry one.
          bool wet = known && worst > 0;
          lv_obj_t *strip = id(out_rain_block), *line = id(out_dry_block);
          lv_obj_add_flag(wet ? line : strip, LV_OBJ_FLAG_HIDDEN);
          lv_obj_clear_flag(wet ? strip : line, LV_OBJ_FLAG_HIDDEN);

sensor:
  - id: out_temp_sensor
    platform: homeassistant
    entity_id: sensor.casa_sanchez_temperature
    on_value:
      - lvgl.label.update:
          id: out_temp
          text: !lambda |-
            if (std::isnan(x)) return std::string("--°");
            return std::to_string((int) lroundf(x)) + "°";

  - id: out_feels_sensor
    platform: homeassistant
    entity_id: sensor.casa_sanchez_feels_like
    on_value:
      - lambda: id(out_feels_val) = x;
      - script.execute: refresh_outside_feels

  - id: out_humidity_sensor
    platform: homeassistant
    entity_id: sensor.casa_sanchez_humidity
    on_value:
      - lambda: id(out_humidity_val) = x;
      - script.execute: refresh_outside_feels

  - id: out_wind_sensor
    platform: homeassistant
    entity_id: sensor.casa_sanchez_wind_speed
    on_value:
      - lambda: id(out_wind_val) = x;
      - script.execute: refresh_outside_feels

  - id: out_gust_sensor
    platform: homeassistant
    entity_id: sensor.casa_sanchez_wind_gust
    on_value:
      - lambda: id(out_gust_val) = x;
      - script.execute: refresh_outside_feels

  - id: out_uv_sensor
    platform: homeassistant
    entity_id: sensor.casa_sanchez_uv_index
    on_value:
      - lambda: id(out_uv_val) = x;
      - script.execute: refresh_outside_cond

  - id: out_daylight_progress_sensor
    platform: homeassistant
    entity_id: sensor.daylight_progress
    on_value:
      - lambda: |-
          int pct = std::isnan(x) ? 0 : (int) lroundf(x);
          if (pct < 0) pct = 0;
          if (pct > 100) pct = 100;
          lv_bar_set_value(id(out_sun_bar), pct, LV_ANIM_OFF);
          // park the marker on the bar itself rather than guessing the width
          int track = lv_obj_get_width(id(out_sun_bar)) - 12;
          if (track < 0) track = 0;
          lv_obj_set_x(id(out_sun_dot), (track * pct) / 100);

  - id: out_aqi_sensor
    platform: homeassistant
    entity_id: sensor.airnow_air_quality_index
    on_value:
      - lambda: id(out_aqi_val) = x;
      - script.execute: refresh_outside_air

  - id: out_dust_sensor
    platform: homeassistant
    entity_id: sensor.dust_conditions
    on_value:
      - lambda: id(out_dust_val_num) = x;
      - script.execute: refresh_outside_dust

globals:
  # Two entities feed one label in three places on this page, and a homeassistant
  # sensor gives you one value per trigger -- so each half is parked here and a
  # script renders the pair.
  - id: out_feels_val
    type: float
    initial_value: "NAN"
  - id: out_humidity_val
    type: float
    initial_value: "NAN"
  - id: out_aqi_val
    type: float
    initial_value: "NAN"
  - id: out_air_desc
    type: std::string
  - id: out_dust_val_num
    type: float
    initial_value: "NAN"
  - id: out_dust_level
    type: std::string
  - id: out_cond_text
    type: std::string
  - id: out_uv_val
    type: float
    initial_value: "NAN"
  - id: out_wind_val
    type: float
    initial_value: "NAN"
  - id: out_gust_val
    type: float
    initial_value: "NAN"

packages:
  outside_access: !include { file: ../../widgets/page_access.yaml, vars: { page: outside } }
