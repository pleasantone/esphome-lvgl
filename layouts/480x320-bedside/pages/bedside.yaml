# Bedside (fork-only, landscape exercise 2026-10-14): the resting page. A
# split-flap clock across the top -- the sleep clock's cards (features/
# sleep_clock/card.yaml, flip_clock.h), awake and full size -- the date under
# it, and My Home's chips as a 2x3 grid in full words, red and amber first.
# More than six: the sixth slot says "+N more" in the colour of the worst one
# it hides. A tap on the grid opens the full list. No titlebar: the clock is
# the title. Night still goes to the dim sleep clock (features/sleep_clock).

substitutions:
  bedside_card_width: "80"
  bedside_card_height: "118"
  bedside_card_gap: "6"
  bedside_pair_gap: "20"

lvgl:
  pages:
    - id: bedside
      <<: !include ../vars/page.yaml
      pad_top: 8
      bg_color: 0x16181D
      scrollable: false
      on_load:
        - script.execute: { id: bedside_clock_refresh, animate: false }
        # after any screen this one replaced has had its unload: the sleep
        # clock's shows the titlebar again, and LVGL sends it after our load
        - delay: 20ms
        - lvgl.widget.hide: titlebar
      on_unload:
        - lvgl.widget.show: titlebar
      widgets:
        - obj:
            width: 100%
            height: 100%
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            clickable: false
            scrollable: false
            layout: { type: FLEX, flex_flow: COLUMN, flex_align_cross: CENTER, pad_row: 6 }
            widgets:
              - obj: # the four cards
                  width: SIZE_CONTENT
                  height: SIZE_CONTENT
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  clickable: false
                  scrollable: false
                  layout: { type: FLEX, flex_flow: ROW, pad_column: "${bedside_pair_gap}" }
                  widgets:
                    - obj: # hours
                        <<: &bedside_pair
                          width: SIZE_CONTENT
                          height: SIZE_CONTENT
                          bg_opa: TRANSP
                          border_width: 0
                          pad_all: 1 # room for the cards' outline
                          clickable: false
                          scrollable: false
                          layout: { type: FLEX, flex_flow: ROW, pad_column: "${bedside_card_gap}" }
                        widgets:
                          - obj: !include { file: ../../../features/sleep_clock/card.yaml, vars: { uid: bs_h1, card_width: "${bedside_card_width}", card_height: "${bedside_card_height}" } }
                          - obj: !include { file: ../../../features/sleep_clock/card.yaml, vars: { uid: bs_h2, card_width: "${bedside_card_width}", card_height: "${bedside_card_height}" } }
                    - obj: # minutes
                        <<: *bedside_pair
                        widgets:
                          - obj: !include { file: ../../../features/sleep_clock/card.yaml, vars: { uid: bs_m1, card_width: "${bedside_card_width}", card_height: "${bedside_card_height}" } }
                          - obj: !include { file: ../../../features/sleep_clock/card.yaml, vars: { uid: bs_m2, card_width: "${bedside_card_width}", card_height: "${bedside_card_height}" } }
              - obj: # AM/PM and the date on one line
                  width: SIZE_CONTENT
                  height: SIZE_CONTENT
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  clickable: false
                  scrollable: false
                  layout: { type: FLEX, flex_flow: ROW, pad_column: 10 }
                  widgets:
                    - label: { id: bs_ampm, text: "", text_font: roboto_md, text_color: 0x9AA0AE }
                    - label: { id: bs_date, text: "", text_font: roboto_md, text_color: 0x9AA0AE }
              - obj: # the chips
                  id: bs_chips
                  width: 100%
                  flex_grow: 1
                  bg_opa: TRANSP
                  border_width: 0
                  pad_top: 4
                  pad_bottom: 0
                  pad_left: 6
                  pad_right: 6
                  scrollable: false
                  layout: { type: FLEX, flex_flow: ROW_WRAP, flex_align_main: SPACE_BETWEEN, pad_row: 6, pad_column: 6 }
                  on_click:
                    - script.execute: open_chip_list
                  widgets:
                    - label:
                        id: bs_quiet
                        width: 100%
                        text_align: CENTER
                        text: "All quiet"
                        text_font: roboto_md
                        text_color: 0x6A7080
                    - obj:
                        id: bs_chip_1
                        hidden: true
                        clickable: false
                        scrollable: false
                        width: 198
                        height: 44
                        radius: 12
                        border_width: 0
                        bg_color: 0x5A6173
                        pad_top: 2
                        pad_bottom: 2
                        pad_left: 8
                        pad_right: 8
                        layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, flex_align_track: CENTER, pad_column: 6 }
                        widgets:
                          - label: { id: bs_chip_1_ic, text: "", text_font: mdi_sm }
                          - label: { id: bs_chip_1_tx, flex_grow: 1, height: 20, long_mode: DOT, text: "", text_font: roboto_sm }
                    - obj:
                        id: bs_chip_2
                        hidden: true
                        clickable: false
                        scrollable: false
                        width: 198
                        height: 44
                        radius: 12
                        border_width: 0
                        bg_color: 0x5A6173
                        pad_top: 2
                        pad_bottom: 2
                        pad_left: 8
                        pad_right: 8
                        layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, flex_align_track: CENTER, pad_column: 6 }
                        widgets:
                          - label: { id: bs_chip_2_ic, text: "", text_font: mdi_sm }
                          - label: { id: bs_chip_2_tx, flex_grow: 1, height: 20, long_mode: DOT, text: "", text_font: roboto_sm }
                    - obj:
                        id: bs_chip_3
                        hidden: true
                        clickable: false
                        scrollable: false
                        width: 198
                        height: 44
                        radius: 12
                        border_width: 0
                        bg_color: 0x5A6173
                        pad_top: 2
                        pad_bottom: 2
                        pad_left: 8
                        pad_right: 8
                        layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, flex_align_track: CENTER, pad_column: 6 }
                        widgets:
                          - label: { id: bs_chip_3_ic, text: "", text_font: mdi_sm }
                          - label: { id: bs_chip_3_tx, flex_grow: 1, height: 20, long_mode: DOT, text: "", text_font: roboto_sm }
                    - obj:
                        id: bs_chip_4
                        hidden: true
                        clickable: false
                        scrollable: false
                        width: 198
                        height: 44
                        radius: 12
                        border_width: 0
                        bg_color: 0x5A6173
                        pad_top: 2
                        pad_bottom: 2
                        pad_left: 8
                        pad_right: 8
                        layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, flex_align_track: CENTER, pad_column: 6 }
                        widgets:
                          - label: { id: bs_chip_4_ic, text: "", text_font: mdi_sm }
                          - label: { id: bs_chip_4_tx, flex_grow: 1, height: 20, long_mode: DOT, text: "", text_font: roboto_sm }
                    - obj:
                        id: bs_chip_5
                        hidden: true
                        clickable: false
                        scrollable: false
                        width: 198
                        height: 44
                        radius: 12
                        border_width: 0
                        bg_color: 0x5A6173
                        pad_top: 2
                        pad_bottom: 2
                        pad_left: 8
                        pad_right: 8
                        layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, flex_align_track: CENTER, pad_column: 6 }
                        widgets:
                          - label: { id: bs_chip_5_ic, text: "", text_font: mdi_sm }
                          - label: { id: bs_chip_5_tx, flex_grow: 1, height: 20, long_mode: DOT, text: "", text_font: roboto_sm }
                    - obj:
                        id: bs_chip_6
                        hidden: true
                        clickable: false
                        scrollable: false
                        width: 198
