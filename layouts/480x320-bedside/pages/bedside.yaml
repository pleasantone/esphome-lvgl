                        bg_color: 0x5A6173
                        pad_top: 2
                        pad_bottom: 2
                        pad_left: 8
                        pad_right: 8
                        layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, flex_align_track: CENTER, pad_column: 6 }
                        widgets:
                          - label: { id: bs_chip_6_ic, text: "", text_font: mdi_sm }
                          - label: { id: bs_chip_6_tx, flex_grow: 1, height: 20, long_mode: DOT, text: "", text_font: roboto_sm }

script:
  - id: bedside_clock_refresh
    parameters:
      animate: bool
    then:
      - lambda: |-
          auto now = id(ha_time).now();
          lv_obj_t *cards[] = {id(bs_h1), id(bs_h2), id(bs_m1), id(bs_m2)};
          if (!now.is_valid()) {
            for (auto *c : cards) flip::set(c, "", false);
            lv_label_set_text(id(bs_ampm), "");
            lv_label_set_text(id(bs_date), "");
            return;
          }
          bool h24 = id(clock_24h).state;
          int hour = h24 ? now.hour : (now.hour + 11) % 12 + 1;
          char hh[3], mm[3];
          snprintf(hh, sizeof(hh), "%02d", hour);
          snprintf(mm, sizeof(mm), "%02d", now.minute);
          std::string h1 = (!h24 && hh[0] == '0') ? "" : std::string(1, hh[0]);
          flip::set(id(bs_h1), h1.c_str(), animate);
          flip::set(id(bs_h2), std::string(1, hh[1]).c_str(), animate);
          flip::set(id(bs_m1), std::string(1, mm[0]).c_str(), animate);
          flip::set(id(bs_m2), std::string(1, mm[1]).c_str(), animate);
          feed::set_raw(id(bs_ampm), h24 ? "" : (now.hour < 12 ? "AM" : "PM"));
          feed::show(id(bs_ampm), !h24);
          feed::set_raw(id(bs_date), now.strftime("%A, %B ") + std::to_string(now.day_of_month));

  - id: !extend chips_changed
    then:
      - lambda: |-
          lv_obj_t *b[] = {id(bs_chip_1), id(bs_chip_2), id(bs_chip_3), id(bs_chip_4), id(bs_chip_5), id(bs_chip_6)};
          lv_obj_t *ic[] = {id(bs_chip_1_ic), id(bs_chip_2_ic), id(bs_chip_3_ic), id(bs_chip_4_ic), id(bs_chip_5_ic), id(bs_chip_6_ic)};
          lv_obj_t *tx[] = {id(bs_chip_1_tx), id(bs_chip_2_tx), id(bs_chip_3_tx), id(bs_chip_4_tx), id(bs_chip_5_tx), id(bs_chip_6_tx)};
          auto &c = feed::chips();
          int n = c.size();
          if (n <= 6) {
            feed::set_list(c, b, ic, tx, 6);
          } else {
            std::vector<feed::Chip> head(c.begin(), c.begin() + 5);
            feed::set_list(head, b, ic, tx, 6);
            int worst = 2;  // the "+N" slot takes the colour of the worst chip it hides
            for (int i = 5; i < n; i++)
              worst = std::min(worst, c[i].level == "act" ? 0 : c[i].level == "warn" ? 1 : 2);
            feed::bg(b[5], worst == 0 ? feed::ACT_BG : worst == 1 ? feed::WARN_BG : feed::INFO_BG);
            uint32_t ink = worst == 1 ? feed::WARN_TEXT : feed::TEXT;
            feed::fg(ic[5], ink);
            feed::fg(tx[5], ink);
            feed::text(ic[5], "\U000F0026");
            feed::text(tx[5], "+" + std::to_string(n - 5) + " more");
            feed::show(b[5], true);
          }
          feed::show(id(bs_quiet), n == 0);

interval:
  - interval: 1s
    then:
      - if:
          condition:
            - lambda: return id(bedside)->is_showing();
          then:
            - script.execute: { id: bedside_clock_refresh, animate: true }

packages:
  bedside_access: !include { file: ../../widgets/page_access.yaml, vars: { page: bedside } }
