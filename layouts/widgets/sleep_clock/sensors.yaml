# The sleep clock's non-LVGL half: its Home Assistant controls, the digit font,
# and the scripts that show and tick it. Pair with page.yaml, and add
# flip_clock.h to esphome: includes:.
#
# It keeps the screen lit at the sleep timeout, so it needs the board to own
# an `idle_sleep_dark` global that its own sleep entry obeys, a `display_sleep`
# script that goes dark, plus `backlight`, `active_brightness` and `sun_band`.
#
# It also owns sleeping on demand: holding the footer's Home button for 1.5s,
# or the "Sleep now" button in Home Assistant, gives the same sleep as the idle
# timer -- the clock if the switch is on, otherwise dark.
#
# required vars:
# - digit_size

esphome:
  on_boot:
    priority: -100 # after LVGL has built home_btn
    then:
      # The hold is attached here rather than in footer/widget.yaml because the
      # footer is shared with the generic layouts, which have no sleep to call.
      # home_btn's own on_press (go home) still fires at touch-down.
      - lambda: |-
          auto cb = [](lv_event_t *e) {
            if (lv_event_get_code(e) == LV_EVENT_PRESSED) {
              id(sleep_hold).execute();
            } else {  // RELEASED or PRESS_LOST: let go before the hold completed
              id(sleep_hold).stop();
            }
          };
          lv_obj_add_event_cb(id(home_btn), cb, LV_EVENT_PRESSED, nullptr);
          lv_obj_add_event_cb(id(home_btn), cb, LV_EVENT_RELEASED, nullptr);
          lv_obj_add_event_cb(id(home_btn), cb, LV_EVENT_PRESS_LOST, nullptr);

button:
  - id: sleep_now_button
    platform: template
    name: Sleep now
    icon: mdi:sleep
    on_press:
      - script.execute: sleep_now

font:
  - id: flip_digits
    file:
      type: gfonts
      family: Roboto Condensed
      weight: bold
    size: ${digit_size}
    glyphs: "0123456789"
    bpp: 4

globals:
  - id: sleep_clock_origin # page index to return to
    type: int
    restore_value: false
    initial_value: '0'
  - id: sleep_clock_red # the palette on screen: -1 not yet applied, 0 day, 1 night
    type: int
    restore_value: false
    initial_value: '-1'

# Red at night: the LCD passes only the red part of the white backlight through
# red pixels, and red is what disturbs dark-adapted eyes least. Everything on
# the face turns, or the outline and date would be the bluest things left.
select:
  - id: sleep_clock_night_colours
    platform: template
    name: Night colours
    icon: mdi:weather-night
    entity_category: config
    options:
      - Follow the sun # night band: sun below -6 degrees
      - Always
      - Never
    initial_option: Follow the sun
    optimistic: true
    restore_value: true

switch:
  - id: sleep_clock_enabled
    platform: template
    name: Sleep clock
    icon: mdi:clock-digital
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    # the board's own sleep entry goes dark only while this is off. A change
    # takes effect at the next sleep: a clock already showing stays up.
    on_state:
      - lambda: id(idle_sleep_dark) = !x;

number:
  - id: sleep_clock_brightness
    platform: template
    name: Sleep clock brightness
    icon: mdi:brightness-4
    entity_category: config
    unit_of_measurement: "%"
    mode: slider
    min_value: 1
    max_value: 50
    step: 1
    initial_value: 10
    optimistic: true
    restore_value: true
    on_value:
      # live while it is showing, so it can be tuned from the dark
      - if:
          condition:
            - lambda: return id(sleep_clock)->is_showing();
          then:
            - script.execute: sleep_clock_backlight

script:
  - id: sleep_now
    then:
      - if:
          condition:
            - switch.is_on: sleep_clock_enabled
          then:
            - script.execute: sleep_clock_show
          else:
            - script.execute: display_sleep

  - id: sleep_hold
    mode: restart
    then:
      - delay: 1500ms # well clear of the 400ms long press the tiles use
      - script.execute: sleep_now
      # the finger is still down: drop the rest of this touch so its release
      # lands on nothing
      - lambda: |-
          for (lv_indev_t *i = lv_indev_get_next(nullptr); i != nullptr; i = lv_indev_get_next(i)) {
            lv_indev_wait_release(i);
          }

  - id: sleep_clock_show
    then:
      # already up (put there by hand, then the idle timer fired): only the
      # backlight is refreshed, or the origin would become the clock itself
      - if:
          condition:
            - lambda: return !id(sleep_clock)->is_showing();
          then:
            - lambda: id(sleep_clock_origin) = id(main_lvgl)->get_current_page();
            - lvgl.page.show: sleep_clock
      - script.execute: sleep_clock_backlight

  - id: sleep_clock_backlight
    then:
      # relative to the sun-driven ceiling, so night is dimmer than day
      - light.turn_on:
          id: backlight
          brightness: !lambda return id(active_brightness) * id(sleep_clock_brightness).state / 100.0f;

  - id: sleep_clock_refresh
    parameters:
      animate: bool
    then:
      - lambda: |-
          auto now = id(ha_time).now();
          if (!now.is_valid()) {  // no time from HA yet
            for (auto *card : {id(sleep_clock_h1), id(sleep_clock_h2), id(sleep_clock_m1), id(sleep_clock_m2)}) {
              flip::set(card, "", false);
            }
            lv_label_set_text(id(sleep_clock_ampm), "");
            lv_label_set_text(id(sleep_clock_date), "");
            return;
          }
          bool h24 = id(clock_24h).state;
          int hour = h24 ? now.hour : (now.hour + 11) % 12 + 1;
          char hh[3], mm[3];
          snprintf(hh, sizeof(hh), "%02d", hour);
          snprintf(mm, sizeof(mm), "%02d", now.minute);
          // a 12-hour clock shows 9:41 on a blank card, not 09:41
          std::string h1 = (!h24 && hh[0] == '0') ? "" : std::string(1, hh[0]);
          flip::set(id(sleep_clock_h1), h1.c_str(), animate);
          flip::set(id(sleep_clock_h2), std::string(1, hh[1]).c_str(), animate);
          flip::set(id(sleep_clock_m1), std::string(1, mm[0]).c_str(), animate);
          flip::set(id(sleep_clock_m2), std::string(1, mm[1]).c_str(), animate);
          lv_label_set_text(id(sleep_clock_ampm), h24 ? "" : (now.hour < 12 ? "AM" : "PM"));
          std::string date = now.strftime("%A, %B ") + std::to_string(now.day_of_month);
          lv_label_set_text(id(sleep_clock_date), date.c_str());
      - script.execute: sleep_clock_colours

  - id: sleep_clock_colours
    then:
      - lambda: |-
          auto mode = id(sleep_clock_night_colours).current_option();
          int red = mode == "Always" || (mode == "Follow the sun" && id(sun_band) == 0);
          if (red == id(sleep_clock_red)) {
            return;  // restyling invalidates the whole face; only do it on a change
          }
          id(sleep_clock_red) = red;
          // night: 4.1:1 digit on card, 4.5:1 outline and 3.4:1 date on black
          uint32_t ink = red ? 0xD04028 : 0xD8D8D8;
          uint32_t face = red ? 0x1A0A08 : 0x1E2024;
          uint32_t edge = red ? 0xD04028 : 0xFFFFFF;
          uint32_t text = red ? 0xB03828 : 0x9AA0AE;
          for (auto *card : {id(sleep_clock_h1), id(sleep_clock_h2), id(sleep_clock_m1), id(sleep_clock_m2)}) {
            flip::set_colors(card, ink, face, edge);
          }
          lv_obj_set_style_text_color(id(sleep_clock_ampm), lv_color_hex(text), 0);
          lv_obj_set_style_text_color(id(sleep_clock_date), lv_color_hex(text), 0);

interval:
  # every second rather than on the minute: flip::set is a no-op for a card
  # that has not changed, and this also picks up a 12/24-hour switch or the
  # first time sync without either having to know the clock exists
  - interval: 1s
    then:
      - if:
          condition:
            - lambda: return id(sleep_clock)->is_showing();
          then:
            - script.execute: { id: sleep_clock_refresh, animate: true }
