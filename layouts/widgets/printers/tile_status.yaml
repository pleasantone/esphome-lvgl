# Remaining time and end time row of a printer tile. The status word sits on
# the title line instead -- see tile_title.yaml.
#
# required vars:
# - uid

# - obj:
  width: 100%
  height: SIZE_CONTENT
  pad_all: 0
  border_width: 0
  bg_opa: 0
  layout:
    type: FLEX
    flex_flow: ROW
    flex_align_main: SPACE_BETWEEN
  widgets:
    - label:
        width: SIZE_CONTENT
        id: ${uid}_remaining_time_lbl
        text: " "
    - label:
        width: SIZE_CONTENT
        id: ${uid}_end_time_lbl
        text: " "
