# The tile's top line: printer name on the left, print status on the right.
#
# The status word lives here rather than beside the times because it answers a
# different question -- "what is this machine doing" belongs with the machine's
# name, not with the countdown.
#
# required vars:
# - uid
# - name

# - obj:
  width: 100%
  height: SIZE_CONTENT
  pad_all: 0
  border_width: 0
  bg_opa: 0
  layout:
    type: FLEX
    flex_flow: ROW
    flex_align_main: SPACE_BETWEEN
    flex_align_cross: CENTER
  widgets:
    - label:
        width: SIZE_CONTENT
        height: SIZE_CONTENT
        text: ${name}
    - label: # right justified by SPACE_BETWEEN. Neutral on purpose: at 16px this
             # is normal text and wants 4.5:1, which no status hue reaches on the
             # tile -- the progress bar is a graphic, so it carries the colour
        id: ${uid}_print_status_lbl
        width: SIZE_CONTENT
        height: SIZE_CONTENT
        text: " "
        text_color: 0xD8DCE6
