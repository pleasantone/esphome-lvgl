# required vars:
# - uid
# - width
# - height
# - text
# - icon_on
# - icon_off
# - color_on

# obj: # an obj, not a button — the theme renders it darker, so it reads as not pressable
  id: ${uid}_widget
  on_click: # never fires -- an obj is not pressable. It exists so a missing
            # sensors package is a build error rather than a tile stuck on "..."
    - lambda: (void) id(${uid}_widget_sensor);
  width: ${width}
  height: ${height}
  # The gold on-state edge is reserved in every state and only revealed when
  # the tile is on. border_width narrows the content area whether or not the
  # border is drawn -- lv_obj_get_style_space_left() adds it whenever
  # border_side includes LEFT -- so turning the width on and off shifted the
  # icon and the label sideways as the tile toggled. Only border_opa moves.
  border_width: 4
  border_side: LEFT
  border_color: 0xFFD700
  border_opa: TRANSP
  radius: 20
  widgets:
    - label:
        id: ${uid}_widget_unknown
        text: "\U000F01D8"
        text_font: mdi_md
        align: TOP_LEFT
    - label:
        id: ${uid}_widget_on
        text: ${icon_on}
        text_font: mdi_md
        text_color: ${color_on}
        align: TOP_LEFT
        hidden: true
    - label:
        id: ${uid}_widget_off
        text: ${icon_off}
        text_font: mdi_md
        text_color: 0x9AA0AE
        align: TOP_LEFT
        hidden: true
    - label:
        id: ${uid}_widget_text
        text: ${text}
        align: BOTTOM_LEFT
