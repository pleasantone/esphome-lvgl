# required vars:
# - uid
# - width
# - height
# - text
# - icon

# obj: # an obj, not a button — the theme renders it darker, so it reads as not pressable
  id: ${uid}_widget
  width: ${width}
  height: ${height}
  border_width: 0
  radius: 20
  widgets:
    - label:
        id: ${uid}_widget_icon
        text: ${icon}
        text_font: mdi_md
        text_color: 0x9AA0AE
        align: TOP_LEFT
    - label:
        id: ${uid}_widget_value
        text: "--"
        text_font: roboto_lg
        align: TOP_RIGHT
    - label:
        id: ${uid}_widget_text
        text: ${text}
        align: BOTTOM_LEFT
