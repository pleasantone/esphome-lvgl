# required vars:
# - uid
# - entity_id
# - width
# - height
# - text
# - icon_on
# - icon_off

# button:
  <<: !include
    file: ../stateful.yaml
    vars:
      uid: ${uid}
      entity_id: ${entity_id}
      width: ${width}
      height: ${height}
      icon_on: ${icon_on}
      icon_off: ${icon_off}
      text: ${text}
  on_short_click:
    # say "asking" until Home Assistant answers: the tile otherwise shows the
    # old state until the round trip lands, so a dropped command looks like
    # success. The sensor callback overwrites this the moment a state arrives
    - lvgl.widget.hide:
        - ${uid}_widget_on
        - ${uid}_widget_off
    - lvgl.widget.show:
        - ${uid}_widget_unknown
    - homeassistant.action:
        action: light.toggle
        data:
          entity_id: ${entity_id}
          brightness_pct: '100'
