# required vars:
# - uid
# - entity_id
# - width
# - height
# - text
# - icon_on
# - icon_off

# button:
  <<: !include
    file: ../stateful.yaml
    vars:
      uid: ${uid}
      width: ${width}
      height: ${height}
      icon_on: ${icon_on}
      icon_off: ${icon_off}
      text: ${text}
  on_short_click: # no brightness_pct, or a tap would undo the slider
    # say "asking" until Home Assistant answers: the tile otherwise shows the
    # old state until the round trip lands, so a dropped command looks like
    # success. The sensor callback overwrites this the moment a state arrives
    - lvgl.widget.hide:
        - ${uid}_widget_on
        - ${uid}_widget_off
    - lvgl.widget.show:
        - ${uid}_widget_unknown
    - homeassistant.action:
        action: light.toggle
        data:
          entity_id: ${entity_id}
  on_long_press:
    - lambda: |-
        id(detail_entity) = "${entity_id}";
        id(detail_title) = "${text}";
        id(detail_origin) = id(main_lvgl)->get_current_page();
    - lvgl.slider.update:
        id: detail_slider
        animated: false
        value: !lambda |-
          float b = id(${uid}_brightness).state;
          return std::isnan(b) ? 1.0f : b / 2.55f;
    - lvgl.label.update:
        id: detail_value
        text: !lambda |-
          float b = id(${uid}_brightness).state;
          return std::to_string(std::isnan(b) ? 1 : (int) (b / 2.55f)) + "%";
    - lvgl.page.show: detail_light
