# Printers, for the CYD: the one personal page that is not shared with
# 480x320-home. home35 gives the H2C all twelve self-revealing AMS slots
# (widgets/printers/tile.yaml + printer.sensors.yaml); on a board with no PSRAM
# that ran LVGL out of memory, so this page lists only the units the printers
# actually have. Add a row and its sensors package here if a unit is added.

lvgl:
  pages:
    - id: printers
      <<: !include ../vars/page.yaml
      on_load:
        - lvgl.label.update:
            id: page_title
            text: Printers
      widgets:
        - obj:
            <<: !include ../vars/container.yaml
            layout:
              <<: !include ../vars/printer_layout.yaml
            widgets:
              - obj: # 1 - X1C -- one AMS, on the name line
                  <<: !include ../vars/printer_tile.yaml
                  layout:
                    <<: !include ../vars/printer_tile_layout.yaml
                  widgets: !include { file: ../../widgets/printers/tile_combined.yaml, vars: {
                    uid: printer_1, name: 1 - X1C,
                    <<: [!include ../vars/ams_row.yaml, !include ../vars/printer_bar.yaml] } }

              - obj: # 2 - H2C -- AMS 1, AMS 2 and an AMS HT
                  <<: !include ../vars/printer_tile.yaml
                  layout:
                    <<: !include ../vars/printer_tile_layout.yaml
                  widgets:
                    - label:
                        width: 100%
                        height: SIZE_CONTENT
                        text: "2 - H2C"
                    - obj:
                        <<: !include { file: ../../widgets/printers/ams_row.yaml, vars: {
                          uid: printer_2, ams_id: "1", label: "1", <<: !include ../vars/ams_row.yaml } }
                    - obj:
                        <<: !include { file: ../../widgets/printers/ams_row.yaml, vars: {
                          uid: printer_2, ams_id: "2", label: "2", <<: !include ../vars/ams_row.yaml } }
                    - obj:
                        <<: !include { file: ../../widgets/printers/ams_row_single.yaml, vars: {
                          uid: printer_2, ams_id: "128", label: "HT", <<: !include ../vars/ams_row.yaml } }
                    - obj:
                        <<: !include { file: ../../widgets/printers/tile_status.yaml, vars: { uid: printer_2 } }
                    - bar:
                        <<: !include { file: ../../widgets/printers/tile_progress.yaml, vars: {
                          uid: printer_2, <<: !include ../vars/printer_bar.yaml } }

packages:
  printer_1_sensors: !include { file: ../../widgets/printers/printer_combined.sensors.yaml, vars: {
    uid: printer_1,
    entity_id_prefix: x1c_x1c_00m09d460801484
  }}

  printer_2_core: !include { file: ../../widgets/printers/sensors_core.yaml, vars: {
    uid: printer_2, entity_id_prefix: h2c_h2c_31b8ap630100072 } }
  printer_2_ams_1: !include { file: ../../widgets/printers/ams_unit.sensors.yaml, vars: {
    uid: printer_2, entity_id_prefix: h2c_h2c_31b8ap630100072, ams_id: "1", variant: "" } }
  printer_2_ams_2: !include { file: ../../widgets/printers/ams_unit.sensors.yaml, vars: {
    uid: printer_2, entity_id_prefix: h2c_h2c_31b8ap630100072, ams_id: "2", variant: "" } }
  printer_2_ams_128: !include { file: ../../widgets/printers/ams_unit.sensors.yaml, vars: {
    uid: printer_2, entity_id_prefix: h2c_h2c_31b8ap630100072, ams_id: "128", variant: "_single" } }
