# Fork-only: the landscape bedside layout (design exercise, 2026-10-14). A real
# 480x320 canvas -- the JC3248W535 turned on its side -- unlike 480x320-home,
# which that board drives at 320 wide. Navigation is a rail down the right edge
# (widgets/rail.yaml) instead of a footer, the titlebar stops where the rail
# starts, and the chips live on the bedside page and the rail's status button
# rather than in a strip. Pages in 480x320-bedside/pages/; the feed drawing is
# 480x320-home's feed.h.

esphome:
  includes:
    - 480x320-home/feed/feed.h # chip strip, printer cards, alert takeover from HA's panel feeds (fork-only)
  # Go home once everything is set up, rather than from splash's on_load: a
  # page.show inside the first page's own load event is dropped, and splash is
  # only the first page while no package adds one ahead of it.
  on_boot:
    - priority: -50 # after page_access.yaml restores the Home page at 0
      then:
        - lambda: id(home_page_restored) = true;
    - priority: -100
      then:
        - script.execute: go_home

font: !include
  file: fonts/fonts.yaml
  vars:
    text_sm: 16
    text_md: 20
    text_lg: 24
    text_xl: 32
    text_xxl: 48
    icons_sm: 20
    icons_md: 26
    icons_lg: 34
    icons_xl: 42
    icons_xxl: 50

globals:
  # The select would restore its position in the list, which points at a
  # different page once pages are added or removed. So remember the page's
  # name instead, as a hash, and page_access.yaml puts it back at boot.
  - id: home_page_hash
    type: uint32_t
    restore_value: true
    initial_value: '0'
  - id: home_page_restored # on_value stays quiet until the restore is done
    type: bool
    initial_value: 'false'

  - id: detail_entity # which light the shared detail page is currently editing
    type: std::string
    restore_value: false
  - id: detail_title
    type: std::string
    restore_value: false
  - id: detail_origin # page index to return to
    type: int
    restore_value: false
    initial_value: '0'

  - id: confirm_entity # which entity the shared confirm dialog would turn off
    type: std::string
    restore_value: false

script:
  # each page's page_access.yaml adds the line that shows it when it's home
  - id: go_home
    then: []

select:
  # Which page is home, from Home Assistant; ${home_page} is the default.
  # Each page's page_access.yaml adds itself to the list.
  - id: home_page_select
    platform: template
    name: Home page
    icon: mdi:home
    entity_category: config
    optimistic: true
    initial_option: ${home_page}
    options: []
    on_value:
      - lambda: |-
          if (id(home_page_restored))
            id(home_page_hash) = fnv1_hash(x);

lvgl:
  on_idle:
    # the confirm dialog must not outlive whoever opened it: with features/idle
    # the screen dims but stays fully touch-live, so a forgotten dialog would
    # leave a live Turn Off under the next finger that lands on the panel --
    # exactly the stray touch the dialog exists to stop
    - timeout: 5min
      then:
        - lvgl.widget.hide: confirm_box
  id: main_lvgl # needed by the detail page's Back button
  default_font: roboto_md
  theme: !include themes/main.yaml
  top_layer:
    widgets:
      - <<: !include { file: 480x320-bedside/widgets/header.yaml }
      - <<: !include { file: 480x320-bedside/widgets/rail.yaml }
      - <<: !include { file: widgets/boot_screen/widget.yaml }
  msgboxes:
    # Shared confirm dialog. The entity to act on is stashed in confirm_entity
    # by the tile that opened it, so one dialog serves every guarded tile.
    - id: confirm_box
      width: 340
      close_button: false
      title: Are you sure?
      widgets:
        - label:
            id: confirm_body
            width: 100%
            long_mode: WRAP
            text: ""
      buttons:
        # 64px tall and nearly half the box wide: a wall panel is operated with a
        # fingertip, and the default footer button is about half that. radius is
        # set to the height, as the AMS tray pills do -- LVGL clamps it to half,
        # which is a full pill. Cancel takes the theme's button colour; only the
        # destructive one is recoloured, in the same red status/alarm uses.
        - id: confirm_cancel
          text: Cancel
          width: 46%
          height: 64
          radius: 64
          on_click:
            - lvgl.widget.hide: confirm_box
        - id: confirm_ok
          text: Turn Off
          width: 46%
          height: 64
          radius: 64
          bg_color: 0xD32F2F # white on this is 4.98:1; the brighter red was 3.55
          on_click:
            # a printer tile stashes "printer:<slug>": its power goes through
            # the guarded script, which refuses while printing or drying
            - if:
                condition:
                  - lambda: return id(confirm_entity).rfind("printer:", 0) == 0;
                then:
                  - homeassistant.action:
                      action: script.bambu_printer_power
                      data:
                        printer: !lambda return id(confirm_entity).substr(8);
                        action: "off"
                else:
                  - homeassistant.action:
                      action: homeassistant.turn_off
                      data:
                        entity_id: !lambda return id(confirm_entity);
            - lvgl.widget.hide: confirm_box
  pages:
    - id: splash # blank until on_boot goes home; top_layer's boot screen covers it
      skip: true

  # every other page is a package in layouts/480x320-bedside/pages/, listed by the
  # top-level config after layout: -- see the README

packages:
  # the personal pages' icons, on top of the shared glyphs.yaml
  glyphs_home: !include fonts/glyphs-home.package.yaml

  # header
  header_sensors: !include { file: widgets/header/sensors.yaml }

  # the chips: the rail's status button and the bedside grid (fork-only)
  chips_sensors: !include { file: 480x320-bedside/feed/chips.sensors.yaml }

  # the rail's chevron-up
  glyphs_bedside: !include fonts/glyphs-bedside.package.yaml

  # boot screen
  boot_screen_sensors: !include { file: widgets/boot_screen/sensors.yaml }
