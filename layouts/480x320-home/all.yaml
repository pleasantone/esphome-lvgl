# Every 480x320-home page, in navigation order. A top-level config can include this
# in place of listing its pages one by one:
#
#   pages: !include layouts/480x320-home/all.yaml

packages:
  living_room: !include pages/living_room.yaml
  climate: !include pages/climate.yaml
  outside: !include pages/outside.yaml
  lighting_main: !include pages/lighting_main.yaml
  lighting_second: !include pages/lighting_second.yaml
  lighting_ground: !include pages/lighting_ground.yaml
  lighting_outside: !include pages/lighting_outside.yaml
  printers: !include pages/printers.yaml
  printer_control: !include pages/printer_control.yaml
