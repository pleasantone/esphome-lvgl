# Climate: the page and the sensors its tiles need.
# Include it from the top-level config after `layout:`; pages appear in the
# order they are listed.

lvgl:
  pages:
    - id: climate
      <<: !include ../vars/page.yaml
      on_load:
        - lvgl.label.update:
            id: page_title
            text: Climate
      widgets:
        - obj:
            <<: !include ../vars/container.yaml
            layout:
              <<: !include ../vars/button_layout.yaml
            widgets:
              - obj: # upstairs thermostat
                  <<: !include
                    file: ../../widgets/stepper/climate/widget.yaml
                    vars:
                      uid: upstairs_thermostat
                      text: Upstairs
                      <<: !include ../vars/stepper.yaml

packages:
  upstairs_thermostat_sensors: !include { file: ../../widgets/stepper/climate/sensors.yaml, vars: {
    uid: upstairs_thermostat,
    entity_id: climate.upstairs,
    step: 1
  }}
