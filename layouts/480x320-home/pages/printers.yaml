# Printers: both printers as cards, from the office panel's printers feed
# (fork-only, 2026-10-13; was tile_combined + tile with ~100 subscriptions).
# Home Assistant shapes the data (~/homeassistant/office-panel/office_panel.jinja
# printer_page); feed.h draws it. Tap a card for Printer Control.
# Include it from the top-level config after `layout:`.

lvgl:
  pages:
    - id: printers
      <<: !include ../vars/page.yaml
      on_load:
        - lvgl.label.update:
            id: page_title
            text: Printers
      widgets:
        - obj:
            <<: !include ../vars/container.yaml
            layout:
              type: FLEX
              flex_flow: COLUMN
              pad_row: 8
            widgets:
              - obj: { <<: !include { file: ../feed/printer_card.yaml, vars: { uid: p_x1c, name: X1C } } }
              - obj: { <<: !include { file: ../feed/printer_card.yaml, vars: { uid: p_h2c, name: H2C } } }

packages:
  printers_access: !include { file: ../../widgets/page_access.yaml, vars: { page: printers } }
  p_x1c_feed: !include { file: ../feed/printer.sensors.yaml, vars: { uid: p_x1c, printer: x1c } }
  p_h2c_feed: !include { file: ../feed/printer.sensors.yaml, vars: { uid: p_h2c, printer: h2c } }
