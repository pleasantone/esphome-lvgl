font: !include
  file: fonts/fonts.yaml
  vars:
    text_sm: 16
    text_md: 20
    text_lg: 24
    text_xl: 32
    text_xxl: 48
    icons_sm: 20
    icons_md: 26
    icons_lg: 34
    icons_xl: 42
    icons_xxl: 50

.sizing:
  - &nav_widget_vars
    height: 50
    padding: 8

  - &page_styles
    <<: !include styles/page_styles.yaml
    pad_top: 50
    pad_bottom: 50

  - &container_styles
    <<: !include styles/container_styles.yaml
    pad_top: 0
    pad_bottom: 0
    pad_left: 6
    pad_right: 6

  - &button_layout
    <<: !include styles/button_layout.yaml
    pad_column: 8
    pad_row: 8

  - &button_widget_vars
    width: 49%
    height: 86

  - &wide_button_widget_vars
    width: 100%
    height: 86

  - &printer_layout
    <<: !include styles/printer_layout.yaml
    pad_row: 4

  - &printer_tile
    <<: !include styles/printer_tile.yaml
    pad_all: 5

  - &printer_tile_layout
    <<: !include styles/printer_tile_layout.yaml
    pad_row: 3

  - &printer_bar_vars
    bar_height: 4

  - &ams_row_vars
    ams_label_width: 24
    ams_hum_width: 40
    ams_strip_width: 175
    ams_tray_width: 40
    ams_tray_height: 20
    ams_tray_padding: 5

globals:
  - id: detail_entity # which light the shared detail page is currently editing
    type: std::string
    restore_value: false
  - id: detail_title
    type: std::string
    restore_value: false
  - id: detail_origin # page index to return to
    type: int
    restore_value: false
    initial_value: '0'

script:
  - id: go_home
    then:
      - lvgl.page.show: ${home_page}

lvgl:
  id: main_lvgl # needed by the detail page's Back button
  default_font: roboto_md
  theme: !include themes/main.yaml
  top_layer:
    widgets:
      - <<: !include { file: widgets/header/widget.yaml, vars: { <<: *nav_widget_vars } }
      - <<: !include { file: widgets/footer/widget.yaml, vars: { <<: *nav_widget_vars } }
      - <<: !include { file: widgets/boot_screen/widget.yaml }
  pages:
    - id: splash
      skip: true
      on_load:
        - delay: 250ms # page.show is dropped if called during this on_load
        - script.execute: go_home

    - id: detail_light
      <<: !include { file: widgets/detail/light_page.yaml, vars: {
        page_styles_pad_top: 50, page_styles_pad_bottom: 50,
        container_pad_left: 6, container_pad_right: 6,
        pad_row: 8, slider_height: 40, back_height: 60 }}

    - id: detail_rgb
      <<: !include { file: widgets/detail/rgb_page.yaml, vars: {
        page_pad_top: 50, page_pad_bottom: 50,
        container_pad_left: 6, container_pad_right: 6,
        pad_row: 8, slider_height: 40, arc_size: 130,
        roller_height: 90, back_height: 50 }}

    - id: living_room
      <<: *page_styles
      on_load:
        - lvgl.label.update:
            id: page_title
            text: Living Room
      widgets:
        - obj:
            <<: *container_styles
            layout:
              <<: *button_layout
            widgets:
              - button: # movie time scene
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/stateless.yaml
                    vars:
                      uid: movie_time
                      icon: "\U000F0FCE"
                      text: Movie Time
                      <<: *button_widget_vars
                  on_short_click:
                    - homeassistant.action:
                        action: scene.turn_on
                        data: { entity_id: scene.movie_time }

              - button: # tv
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/media_buttons/widget.yaml
                    vars:
                      uid: living_room_tv
                      entity_id: media_player.lg_webos_tv
                      text: TV
                      icon_on: "\U000F0502"
                      icon_off: "\U000F0502"
                      <<: *button_widget_vars

              - button: # tv backlight
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_buttons/rgb.yaml
                    vars:
                      uid: tv_backlight
                      entity_id: light.tv_backlight
                      text: TV Backlight
                      icon_on: "\U000F1051"
                      icon_off: "\U000F1051"
                      <<: *button_widget_vars

              - button: # floor lamp
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_buttons/themed.yaml
                    vars:
                      uid: floor_lamp
                      entity_id: light.floor_lamp
                      text: Floor Lamp
                      icon_on: "\U000F08DD"
                      icon_off: "\U000F08DD"
                      <<: *button_widget_vars

              - button: # floor lamp 2
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_buttons/themed.yaml
                    vars:
                      uid: floor_lamp_2
                      entity_id: light.floor_lamp_2
                      text: Floor Lamp 2
                      icon_on: "\U000F08DD"
                      icon_off: "\U000F08DD"
                      <<: *button_widget_vars

              - button: # chandelier
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_buttons/dimmable.yaml
                    vars:
                      uid: living_room_chandelier
                      entity_id: light.living_room_chandelier
                      text: Chandelier
                      icon_on: "\U000F1793"
                      icon_off: "\U000F1793"
                      <<: *button_widget_vars

              - obj: # temperature
                  <<: !include
                    file: widgets/status/value/widget.yaml
                    vars:
                      uid: living_room_temp
                      text: Temperature
                      icon: "\U000F050F"
                      <<: *button_widget_vars

    - id: lighting_main
      <<: *page_styles
      on_load:
        - lvgl.label.update:
            id: page_title
            text: Main Floor Lighting
      widgets:
        - obj:
            <<: *container_styles
            layout:
              <<: *button_layout
            widgets:
              - button: # main floor lights
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_group_buttons/widget.yaml
                    vars:
                      uid: main_floor_lights
                      entity_id: light.main_floor_lights
                      text: Main Floor
                      <<: *wide_button_widget_vars

              - button: # kitchen light
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_buttons/dimmable.yaml
                    vars:
                      uid: kitchen_light
                      entity_id: light.kitchen_main_lights
                      text: Kitchen
                      icon_on: "\U000F1793"
                      icon_off: "\U000F1793"
                      <<: *button_widget_vars

              - button: # dining room light
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_buttons/dimmable.yaml
                    vars:
                      uid: dining_room_light
                      entity_id: light.dining_room_main_lights
                      text: Dining
                      icon_on: "\U000F1793"
                      icon_off: "\U000F1793"
                      <<: *button_widget_vars

              - button: # living room chandelier
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_buttons/dimmable.yaml
                    vars:
                      uid: living_room_light
                      entity_id: light.living_room_chandelier
                      text: Living Rm
                      icon_on: "\U000F1793"
                      icon_off: "\U000F1793"
                      <<: *button_widget_vars

              - button: # office light
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_buttons/dimmable.yaml
                    vars:
                      uid: office_light
                      entity_id: light.office_main_lights
                      text: Office
                      icon_on: "\U000F1793"
                      icon_off: "\U000F1793"
                      <<: *button_widget_vars

              - button: # foyer light
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_buttons/dimmable.yaml
                    vars:
                      uid: foyer_light
                      entity_id: light.front_foyer_main_lights
                      text: Foyer
                      icon_on: "\U000F1793"
                      icon_off: "\U000F1793"
                      <<: *button_widget_vars

              - button: # hallway light
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_buttons/dimmable.yaml
                    vars:
                      uid: hallway_light
                      entity_id: light.hallway_main_lights
                      text: Hallway
                      icon_on: "\U000F1793"
                      icon_off: "\U000F1793"
                      <<: *button_widget_vars

    - id: lighting_second
      <<: *page_styles
      on_load:
        - lvgl.label.update:
            id: page_title
            text: Second Floor Lighting
      widgets:
        - obj:
            <<: *container_styles
            layout:
              <<: *button_layout
            widgets:
              - button: # second floor lights
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_group_buttons/widget.yaml
                    vars:
                      uid: second_floor_lights
                      entity_id: light.second_floor_lights
                      text: Second Floor
                      <<: *wide_button_widget_vars

              - button: # bedroom light
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_buttons/dimmable.yaml
                    vars:
                      uid: bedroom_main_light
                      entity_id: light.bedroom_light
                      text: Bedroom
                      icon_on: "\U000F1793"
                      icon_off: "\U000F1793"
                      <<: *button_widget_vars

              - button: # bedroom closet light
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_buttons/dimmable.yaml
                    vars:
                      uid: bedroom_closet_light
                      entity_id: light.bedroom_closet_light
                      text: Closet
                      icon_on: "\U000F091C"
                      icon_off: "\U000F091C"
                      <<: *button_widget_vars

              - button: # deb's office light
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_buttons/dimmable.yaml
                    vars:
                      uid: deb_light
                      entity_id: light.deb_main_lights
                      text: Deb
                      icon_on: "\U000F1793"
                      icon_off: "\U000F1793"
                      <<: *button_widget_vars

              - button: # stairway light
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_buttons/dimmable.yaml
                    vars:
                      uid: stairway_light
                      entity_id: light.stairs_main_lights
                      text: Stairway
                      icon_on: "\U000F1793"
                      icon_off: "\U000F1793"
                      <<: *button_widget_vars

              - button: # main bathroom light
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_buttons/themed.yaml
                    vars:
                      uid: main_bathroom_light
                      entity_id: light.main_bathroom_light
                      text: Bathroom
                      icon_on: "\U000F179B"
                      icon_off: "\U000F179B"
                      <<: *button_widget_vars

    - id: lighting_ground
      <<: *page_styles
      on_load:
        - lvgl.label.update:
            id: page_title
            text: Ground Floor
      widgets:
        - obj:
            <<: *container_styles
            layout:
              <<: *button_layout
            widgets:
              - button: # garage wall light
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_buttons/dimmable.yaml
                    vars:
                      uid: garage_light
                      entity_id: light.garage_wall_lights
                      text: Garage
                      icon_on: "\U000F091C"
                      icon_off: "\U000F091C"
                      <<: *button_widget_vars

              - button: # garage door
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/cover_buttons/widget.yaml
                    vars:
                      uid: garage_door
                      entity_id: cover.garage_door
                      text: Door
                      icon_open: "\U000F06DA"
                      icon_closed: "\U000F06D9"
                      <<: *button_widget_vars

              - obj: # clothes dryer
                  <<: !include
                    file: widgets/status/binary/widget.yaml
                    vars:
                      uid: clothes_dryer
                      text: Dryer
                      icon_on: "\U000F0917"
                      icon_off: "\U000F0917"
                      color_on: 0xFFD700
                      <<: *button_widget_vars

              - obj: # sump flooding
                  <<: !include
                    file: widgets/status/binary/widget.yaml
                    vars:
                      uid: sump_flooding
                      text: Flooding
                      icon_on: "\U000F1502"
                      icon_off: "\U000F1502"
                      color_on: 0xFF3B30
                      <<: *button_widget_vars

              - obj: # front sump pump
                  <<: !include
                    file: widgets/status/binary/widget.yaml
                    vars:
                      uid: front_sump_pump
                      text: Front Sump
                      icon_on: "\U000F058F"
                      icon_off: "\U000F058F"
                      color_on: 0xFFD700
                      <<: *button_widget_vars

              - obj: # rear sump pump
                  <<: !include
                    file: widgets/status/binary/widget.yaml
                    vars:
                      uid: rear_sump_pump
                      text: Rear Sump
                      icon_on: "\U000F058F"
                      icon_off: "\U000F058F"
                      color_on: 0xFFD700
                      <<: *button_widget_vars

    - id: lighting_outside
      <<: *page_styles
      on_load:
        - lvgl.label.update:
            id: page_title
            text: Outside
      widgets:
        - obj:
            <<: *container_styles
            layout:
              <<: *button_layout
            widgets:
              - button: # outside lights
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_group_buttons/widget.yaml
                    vars:
                      uid: outside_lights
                      entity_id: light.outside_lights
                      text: Outside Lights
                      <<: *wide_button_widget_vars

              - button: # front porch light
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_buttons/dimmable.yaml
                    vars:
                      uid: front_porch_light
                      entity_id: light.front_porch_main_lights
                      text: Front Porch
                      icon_on: "\U000F091C"
                      icon_off: "\U000F091C"
                      <<: *button_widget_vars

              - button: # rope lights
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_buttons/themed.yaml
                    vars:
                      uid: rope_lights
                      entity_id: light.rope_lights
                      text: Rope Lights
                      icon_on: "\U000F12BA"
                      icon_off: "\U000F12BA"
                      <<: *button_widget_vars

              - button: # back yard light
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_buttons/themed.yaml
                    vars:
                      uid: back_yard_light
                      entity_id: light.back_yard_light
                      text: Back Yard
                      icon_on: "\U000F0C4C"
                      icon_off: "\U000F0C4C"
                      <<: *button_widget_vars

              - obj: # doorbell
                  <<: !include
                    file: widgets/status/binary/widget.yaml
                    vars:
                      uid: doorbell
                      text: Doorbell
                      icon_on: "\U000F12E6"
                      icon_off: "\U000F12E6"
                      color_on: 0xFFD700
                      <<: *button_widget_vars

              - obj: # package delivered
                  <<: !include
                    file: widgets/status/binary/widget.yaml
                    vars:
                      uid: package
                      text: Package
                      icon_on: "\U000F03D7"
                      icon_off: "\U000F03D7"
                      color_on: 0xFFD700
                      <<: *button_widget_vars

              - obj: # alarm state
                  <<: !include
                    file: widgets/status/alarm/widget.yaml
                    vars:
                      uid: home_alarm
                      <<: *button_widget_vars

    - id: printers
      <<: *page_styles
      on_load:
        - lvgl.label.update:
            id: page_title
            text: Printers
      widgets:
        - obj:
            <<: *container_styles
            layout:
              <<: *printer_layout
            widgets:
              - obj: # 1 - X1C
                  <<: *printer_tile
                  layout:
                    <<: *printer_tile_layout
                  widgets:
                    - label: # printer name
                        width: 100%
                        height: SIZE_CONTENT
                        text: 1 - X1C
                    - obj: # AMS 1
                        <<: !include { file: widgets/printers/ams_row.yaml, vars: {
                          uid: printer_1, ams_id: "1", label: "1", <<: *ams_row_vars } }
                    - obj: # status / times
                        <<: !include { file: widgets/printers/tile_status.yaml, vars: {
                          uid: printer_1 } }
                    - bar: # print progress
                        <<: !include { file: widgets/printers/tile_progress.yaml, vars: {
                          uid: printer_1, <<: *printer_bar_vars } }

              - obj: # 2 - H2C
                  <<: *printer_tile
                  layout:
                    <<: *printer_tile_layout
                  widgets:
                    - label: # printer name
                        width: 100%
                        height: SIZE_CONTENT
                        text: 2 - H2C
                    - obj: # AMS 1
                        <<: !include { file: widgets/printers/ams_row.yaml, vars: {
                          uid: printer_2, ams_id: "1", label: "1", <<: *ams_row_vars } }
                    - obj: # AMS 2
                        <<: !include { file: widgets/printers/ams_row.yaml, vars: {
                          uid: printer_2, ams_id: "2", label: "2", <<: *ams_row_vars } }
                    - obj: # AMS HT
                        <<: !include { file: widgets/printers/ams_row_single.yaml, vars: {
                          uid: printer_2, ams_id: "128", label: "HT", <<: *ams_row_vars } }
                    - obj: # status / times
                        <<: !include { file: widgets/printers/tile_status.yaml, vars: {
                          uid: printer_2 } }
                    - bar: # print progress
                        <<: !include { file: widgets/printers/tile_progress.yaml, vars: {
                          uid: printer_2, <<: *printer_bar_vars } }

