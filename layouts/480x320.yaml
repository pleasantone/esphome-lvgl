esphome:
  includes:
    - widgets/printers/tray_color.h # tray::bg / tray::ink, shared by every tray pill

font: !include
  file: fonts/fonts.yaml
  vars:
    text_sm: 16
    text_md: 20
    text_lg: 24
    text_xl: 32
    text_xxl: 48
    icons_sm: 20
    icons_md: 26
    icons_lg: 34
    icons_xl: 42
    icons_xxl: 50

.sizing:
  - &nav_widget_vars
    height: 50
    padding: 8

  - &page_styles
    <<: !include styles/page_styles.yaml
    pad_top: 50
    pad_bottom: 50

  - &container_styles
    <<: !include styles/container_styles.yaml
    pad_top: 0
    pad_bottom: 0
    pad_left: 6
    pad_right: 6

  - &button_layout
    <<: !include styles/button_layout.yaml
    pad_column: 8
    pad_row: 8

  - &button_widget_vars
    width: 49%
    height: 86

  - &wide_button_widget_vars
    width: 100%
    height: 86

  - &printer_layout
    <<: !include styles/printer_layout.yaml
    pad_row: 4

  - &printer_tile
    <<: !include styles/printer_tile.yaml
    pad_all: 5

  - &printer_tile_layout
    <<: !include styles/printer_tile_layout.yaml
    pad_row: 3

  - &printer_bar_vars
    bar_height: 4

  - &ams_row_vars
    # 'HT2' is 30px at roboto_sm 16; the humidity group is heater 20 + 2 + '99'
    # 18 + 2 + glyph 20. Row total 30 + 5 + 62 + 5 + 175 = 277 of 298.
    ams_label_width: 30 # fits 'HT2'
    ams_hum_width: 62
    ams_hum_value_width: 18 # fits '99'; keeps the heater icon in one place
    ams_strip_width: 175 # 4 * ams_tray_width + 3 * ams_tray_padding
    ams_tray_width: 40
    ams_tray_height: 20
    ams_tray_padding: 5

globals:
  - id: detail_entity # which light the shared detail page is currently editing
    type: std::string
    restore_value: false
  - id: detail_title
    type: std::string
    restore_value: false
  - id: detail_origin # page index to return to
    type: int
    restore_value: false
    initial_value: '0'

  - id: confirm_entity # which entity the shared confirm dialog would turn off
    type: std::string
    restore_value: false

script:
  - id: go_home
    then:
      - lvgl.page.show: ${home_page}

lvgl:
  # Idle behaviour that belongs to the UI rather than to the board: the device
  # file owns the backlight and the pause, and knows nothing about these ids.
  # Both lists merge -- packages concatenate them, and each entry keeps its own
  # timeout.
  on_idle:
    # the confirm dialog must not outlive whoever opened it. Between the dim at
    # 5 minutes and the sleep at 30 the screen is dark but fully touch-live, so
    # a forgotten dialog leaves a live Turn Off under the next finger that
    # lands on the panel -- exactly the stray touch the dialog exists to stop
    - timeout: 5min
      then:
        - lvgl.widget.hide: confirm_box
    # come back on the home page rather than on whatever was left open, e.g.
    # the shared detail page still editing a light someone has since turned off
    # elsewhere. 20 minutes, not 30: at 30 this would race the device file's
    # lvgl.pause, and a page change is not worth betting on across a paused
    # LVGL. By 20 minutes the panel has been ignored long enough that a flip on
    # an already-dimmed screen bothers nobody.
    - timeout: 20min
      then:
        - script.execute: go_home
  id: main_lvgl # needed by the detail page's Back button
  default_font: roboto_md
  theme: !include themes/main.yaml
  top_layer:
    widgets:
      - <<: !include { file: widgets/header/widget.yaml, vars: { <<: *nav_widget_vars } }
      - <<: !include { file: widgets/footer/widget.yaml, vars: { <<: *nav_widget_vars } }
      - <<: !include { file: widgets/boot_screen/widget.yaml }
  msgboxes:
    # Shared confirm dialog. The entity to act on is stashed in confirm_entity
    # by the tile that opened it, so one dialog serves every guarded tile.
    - id: confirm_box
      width: 300
      close_button: false
      title: Are you sure?
      widgets:
        - label:
            id: confirm_body
            width: 100%
            long_mode: WRAP
            text: ""
      buttons:
        # 64px tall and nearly half the box wide: a wall panel is operated with a
        # fingertip, and the default footer button is about half that. radius is
        # set to the height, as the AMS tray pills do -- LVGL clamps it to half,
        # which is a full pill. Cancel takes the theme's button colour; only the
        # destructive one is recoloured, in the same red status/alarm uses.
        - id: confirm_cancel
          text: Cancel
          width: 46%
          height: 64
          radius: 64
          on_click:
            - lvgl.widget.hide: confirm_box
        - id: confirm_ok
          text: Turn Off
          width: 46%
          height: 64
          radius: 64
          bg_color: 0xD32F2F # white on this is 4.98:1; the brighter red was 3.55
          on_click:
            - homeassistant.action:
                action: homeassistant.turn_off
                data:
                  entity_id: !lambda return id(confirm_entity);
            - lvgl.widget.hide: confirm_box
  pages:
    - id: splash
      skip: true
      on_load:
        - delay: 250ms # page.show is dropped if called during this on_load
        - script.execute: go_home

    - id: detail_light
      <<: !include { file: widgets/detail/light_page.yaml, vars: {
        page_styles_pad_top: 50, page_styles_pad_bottom: 50,
        container_pad_left: 6, container_pad_right: 6,
        pad_row: 8, slider_height: 40, back_height: 60 }}

    - id: detail_rgb
      <<: !include { file: widgets/detail/rgb_page.yaml, vars: {
        page_pad_top: 50, page_pad_bottom: 50,
        container_pad_left: 6, container_pad_right: 6,
        pad_row: 8, slider_height: 40, arc_size: 130,
        roller_height: 90, back_height: 50 }}

    - id: living_room
      <<: *page_styles
      on_load:
        - lvgl.label.update:
            id: page_title
            text: Living Room
      widgets:
        - obj:
            <<: *container_styles
            layout:
              <<: *button_layout
            widgets:
              - button: # movie time scene
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/stateless.yaml
                    vars:
                      uid: movie_time
                      icon: "\U000F0FCE"
                      text: Movie Time
                      <<: *button_widget_vars
                  on_short_click:
                    - homeassistant.action:
                        action: scene.turn_on
                        data: { entity_id: scene.movie_time }

              - button: # tv
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/media_buttons/widget.yaml
                    vars:
                      uid: living_room_tv
                      entity_id: media_player.lg_webos_tv
                      text: TV
                      icon_on: "\U000F0502"
                      icon_off: "\U000F083B"
                      <<: *button_widget_vars

              - button: # chandelier
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_buttons/dimmable.yaml
                    vars:
                      uid: living_room_chandelier
                      entity_id: light.living_room_chandelier
                      text: Chandelier
                      icon_on: "\U000F0769"
                      icon_off: "\U000F17C7"
                      <<: *button_widget_vars

              - button: # tv backlight
                  <<: !include
                    file: widgets/buttons/icon_text_buttons/light_buttons/rgb.yaml
                    vars:
                      uid: tv_backlight
                      entity_id: light.tv_backlight
                      text: TV Backlight
                      icon_on: "\U000F1051"
                      icon_off: "\U000F1A4B"
                      <<: *button_widget_vars

              - button: # floor lamp
