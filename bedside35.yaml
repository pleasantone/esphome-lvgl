# Fork-only: home35's board (Guition JC3248W535) turned on its side, running
# the landscape bedside layout (design exercise, 2026-10-14). It runs on the
# bedroom panel in place of home35.yaml, under home35's name, so Home Assistant
# keeps the same device and entities -- going back is flashing home35.yaml.
# sdl-bedside*.yaml are its previews.

esphome:
  name: home35
  friendly_name: Home 3.5"
  name_add_mac_suffix: true

substitutions:
  home_page: bedside

packages:
  common: !include common.yaml
  device: !include devices/JC3248W535.yaml
  # the layout, every page and feature, the HA controls: shared by every bedside panel
  panel: !include { file: layouts/480x320-bedside/panel.yaml, vars: { printers_page: printers } }
  # after panel: a package listed later wins, so these beat the features' defaults
  sizes: !include layouts/480x320-bedside/sizes/landscape.yaml
  memory: !include features/diagnostics/memory.yaml
  psram: !include features/diagnostics/psram.yaml
  ble_proxy: !include features/ble_proxy/ble_proxy.yaml

# landscape: LVGL rotates in software; the panel itself is portrait-only
lvgl:
  rotation: 90

# passive: listen for advertisements without sending scan requests (as home35)
esp32_ble_tracker:
  scan_parameters:
    active: false
