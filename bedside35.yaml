# Fork-only: home35's board (Guition JC3248W535) turned on its side, running
# the landscape bedside layout (design exercise, 2026-10-14). Not flashed yet:
# compiled to measure what landscape costs; sdl-bedside*.yaml are its previews.

esphome:
  name: bedside35
  friendly_name: Bedside 3.5"
  name_add_mac_suffix: true

substitutions:
  home_page: bedside
  sleep_clock_card_width: "96"
  sleep_clock_card_height: "140"
  sleep_clock_card_gap: "8"
  sleep_clock_pair_gap: "24"
  sleep_clock_digit_size: "104"

packages:
  common: !include common.yaml
  device: !include devices/JC3248W535.yaml
  layout: !include layouts/480x320-bedside.yaml
  bedside: !include layouts/480x320-bedside/pages/bedside.yaml
  printers: !include layouts/480x320-bedside/pages/printers.yaml
  idle: !include features/idle/idle.yaml
  ceiling: !include features/idle/sun.yaml
  sleep_clock: !include features/sleep_clock/sleep_clock.yaml
  alert: !include layouts/480x320-bedside/pages/alert.yaml
  chip_list: !include layouts/480x320-bedside/pages/chips.yaml
  memory: !include features/diagnostics/memory.yaml
  psram: !include features/diagnostics/psram.yaml
  ble_proxy: !include features/ble_proxy/ble_proxy.yaml

# landscape: LVGL rotates in software; the panel itself is portrait-only
lvgl:
  rotation: 90
