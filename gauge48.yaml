# Fork-only, throwaway: an edge gauge for the 4848S040 (2026-10-15). A staircase
# on each edge, one pixel further in per step, numbered every 5: the first step
# you can see is how many rows/columns that edge hides. Runs under home48's
# name; flash bedside48.yaml again afterwards.

esphome:
  name: home48
  friendly_name: Home 4"

packages:
  common: !include common.yaml
  device: !include devices/ESP32-4848S040.yaml

time:
  - id: ha_time
    platform: homeassistant

lvgl:
  bg_color: 0x000000
  pages:
    - id: gauge
      bg_color: 0x000000
      scrollable: false
      pad_all: 0
      widgets:
