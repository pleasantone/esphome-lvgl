esphome:
  min_version: 2026.9.0

logger:
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

web_server:
  port: 80

ota:
  - platform: esphome
    encryption: # inherits the api key

api:
  encryption:
    key: !secret api_encryption_key
  on_client_connected:
    - globals.set:
        id: homeassistant_ip
        value: !lambda return client_address;

switch:
  - platform: restart
    name: Restart

binary_sensor:
  - platform: status
    name: Status

# Evidence for the next unexplained restart: uptime shows that one happened,
# reset reason says why (a crash, a watchdog, or the 15-minute api/wifi
# reboot_timeout, which reads as a software reset), and the heap sensors show
# whether memory was running out on the way there.
debug:
  update_interval: 60s

sensor:
  - platform: uptime
    name: Uptime
    entity_category: diagnostic

  - platform: debug
    free:
      name: Heap Free
    min_free:
      name: Heap Min Free
    block:
      name: Heap Largest Block
    loop_time:
      name: Loop Time

  - id: wifi_signal_db
    name: WiFi Signal
    platform: wifi_signal
    update_interval: 60s
    entity_category: diagnostic

  - id: wifi_signal_strength
    name: WiFi Strength
    platform: copy
    source_id: wifi_signal_db
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: diagnostic

text_sensor:
  - platform: debug
    reset_reason:
      name: Reset Reason
  - platform: wifi_info
    ip_address:
      name: IP Address
      entity_category: diagnostic
    ssid:
      name: Connected SSID
      entity_category: diagnostic
    mac_address:
      name: Mac Address
      entity_category: diagnostic

globals:
  - id: homeassistant_ip
    type: std::string
