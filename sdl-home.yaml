# The personal layout in an SDL window -- no hardware, no secrets, no WiFi.
# sdl-example.yaml is the generic counterpart; this one previews what home35
# actually renders.

esphome:
  name: sdl-home
  friendly_name: sdl-home

substitutions:
  home_page: lighting_main
  sdl_width: "320"
  sdl_height: "480"

packages:
  device: !include devices/SDL.yaml
  layout: !include layouts/480x320-home.yaml
  # pages, in navigation order -- or every page at once:
  # pages: !include layouts/480x320-home/all.yaml
  living_room: !include layouts/480x320-home/pages/living_room.yaml
  climate: !include layouts/480x320-home/pages/climate.yaml
  lighting_main: !include layouts/480x320-home/pages/lighting_main.yaml
  lighting_second: !include layouts/480x320-home/pages/lighting_second.yaml
  lighting_ground: !include layouts/480x320-home/pages/lighting_ground.yaml
  lighting_outside: !include layouts/480x320-home/pages/lighting_outside.yaml
  printers: !include layouts/480x320-home/pages/printers.yaml
  printer_control: !include layouts/480x320-home/pages/printer_control.yaml
  idle: !include features/idle/idle.yaml
  ceiling: !include features/idle/sun.yaml
  sleep_clock: !include features/sleep_clock/sleep_clock.yaml
