# Fork-only: the bedside layout on a 480x480 canvas, a mockup for the Guition
# ESP32-S3-4848S040 (4in square, wall-box mount; 2026-10-15) -- no hardware, no
# secrets, no WiFi. Same pages and rail as the 480x320 landscape panel; the
# square's extra 160px goes to bigger tiles, a bigger clock, two more chips and
# a taller Outside page.

esphome:
  name: sdl-square
  friendly_name: sdl-square

substitutions:
  home_page: bedside
  sdl_width: "480"
  sdl_height: "480"

packages:
  device: !include devices/SDL.yaml
  # the layout, every page and feature, the HA controls: shared by every bedside panel
  panel: !include { file: layouts/480x320-bedside/panel.yaml, vars: { printers_page: printers_lanes } }
  # after panel: a package listed later wins, so these beat the features' defaults
  sizes: !include layouts/480x320-bedside/sizes/square.yaml
