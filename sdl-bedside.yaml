# Fork-only: the landscape bedside layout in an SDL window (design exercise,
# 2026-10-14) -- no hardware, no secrets, no WiFi. The board would be home35's
# JC3248W535 turned on its side, 480x320.

esphome:
  name: sdl-bedside
  friendly_name: sdl-bedside

substitutions:
  home_page: bedside
  sdl_width: "480"
  sdl_height: "320"

packages:
  device: !include devices/SDL.yaml
  # the layout, every page and feature, the HA controls: shared by every bedside panel
  panel: !include { file: layouts/480x320-bedside/panel.yaml, vars: { printers_page: printers } }
  # after panel: a package listed later wins, so these beat the features' defaults
  sizes: !include layouts/480x320-bedside/sizes/landscape.yaml
